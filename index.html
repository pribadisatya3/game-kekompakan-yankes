<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kekompakan Tim Yankes Badung</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top left, #f0f9ff, #e0f2fe 40%, #f8fafc 100%);
      min-height: 100vh;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.08);
    }
    @keyframes pulse-fast {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .animate-pulse-fast {
      animation: pulse-fast 0.8s infinite;
    }
  </style>
</head>
<body class="text-slate-800 antialiased selection:bg-sky-200 selection:text-sky-900">

  <!-- Top Navbar dengan Logo Memanjang -->
  <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-200/80 shadow-xs">
    <div class="max-w-5xl mx-auto px-4 py-2.5 flex items-center justify-between gap-3">
      
      <!-- Logo Bentuk Memanjang (Wide Horizontal Logo) -->
      <!-- Catatan: Jika ingin memakai gambar PNG memanjang sendiri, ganti isi div ini dengan: <img src="logo-yankes-panjang.png" alt="Logo Yankes Badung" class="h-11 w-auto object-contain" /> -->
      <div onclick="goHome()" class="flex items-center gap-3 px-3.5 py-2 rounded-2xl bg-gradient-to-r from-slate-900 via-sky-950 to-teal-900 text-white shadow-md cursor-pointer hover:opacity-95 transition select-none max-w-full overflow-hidden">
        <!-- Emblem Ikon Kesehatan -->
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-sky-400 to-teal-400 flex items-center justify-center text-slate-950 shrink-0 shadow-inner">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 2a2 2 0 0 0-2 2v5H4a2 2 0 0 0-2 2v2c0 1.1.9 2 2 2h5v5c0 1.1.9 2 2 2h2a2 2 0 0 0 2-2v-5h5a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2h-5V4a2 2 0 0 0-2-2h-2z"/>
          </svg>
        </div>

        <!-- Garis Pemisah Vertikal -->
        <div class="h-7 w-[1.5px] bg-white/20 shrink-0"></div>

        <!-- Teks Identitas Memanjang -->
        <div class="flex flex-col sm:flex-row sm:items-center sm:gap-3 min-w-0">
          <div class="leading-none">
            <span class="font-extrabold text-sm sm:text-base tracking-wide text-white block">
              YANKES <span class="text-teal-300">BADUNG</span>
            </span>
            <span class="text-[10px] font-semibold text-sky-200/90 tracking-wider uppercase block mt-0.5">
              Dinas Kesehatan Kab. Badung
            </span>
          </div>

          <div class="hidden md:block h-5 w-[1px] bg-white/15"></div>

          <div class="hidden md:block text-[11px] font-medium text-slate-300 leading-tight">
            Bidang Pelayanan Kesehatan<br/>
            <span class="text-teal-300 font-semibold">Team Synergy &amp; Evaluation</span>
          </div>
        </div>
      </div>

      <!-- Tombol Kanan -->
      <div class="flex items-center gap-2 shrink-0">
        <button id="soundToggleBtn" onclick="toggleSound()" title="Suara Efek" class="p-2.5 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 transition">
          <i id="soundIcon" data-lucide="volume-2" class="w-4 h-4"></i>
        </button>
        <button onclick="openAdminModal()" class="flex items-center gap-1.5 px-3.5 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold shadow-sm transition">
          <i data-lucide="layout-dashboard" class="w-4 h-4 text-teal-400"></i>
          <span>Dashboard</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main App Container -->
  <main id="app" class="max-w-4xl mx-auto px-4 py-8"></main>

  <!-- Admin Login & Dashboard Modal -->
  <div id="adminModal" class="fixed inset-0 z-50 hidden bg-slate-900/65 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4">
    <div class="bg-white rounded-2xl max-w-5xl w-full max-h-[92vh] overflow-hidden shadow-2xl flex flex-col">
      <!-- Modal Header -->
      <div class="px-6 py-4 bg-slate-900 text-white flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <i data-lucide="bar-chart-3" class="w-5 h-5 text-teal-400"></i>
          <div>
            <h2 class="font-bold text-base leading-tight">Dashboard Rekapitulasi Kekompakan Tim</h2>
            <p class="text-[11px] text-slate-400">Seluruh hasil ronde, detail jawaban anggota, dan skor evaluasi</p>
          </div>
        </div>
        <button onclick="closeAdminModal()" class="p-1.5 rounded-lg hover:bg-slate-800 text-slate-300 hover:text-white transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Modal Body -->
      <div id="adminModalBody" class="p-5 sm:p-6 overflow-y-auto flex-1"></div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. AUDIO ENGINE (WEB AUDIO API)
    // ==========================================
    let soundEnabled = true;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(freq, type = 'sine', duration = 0.15, vol = 0.12) {
      if (!soundEnabled) return;
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playSuccess() {
      playTone(523.25, 'triangle', 0.12, 0.15);
      setTimeout(() => playTone(659.25, 'triangle', 0.15, 0.15), 90);
      setTimeout(() => playTone(783.99, 'triangle', 0.25, 0.15), 180);
    }

    function playError() {
      playTone(220, 'sawtooth', 0.18, 0.12);
      setTimeout(() => playTone(180, 'sawtooth', 0.25, 0.12), 130);
    }

    function playTick(urgent = false) {
      playTone(urgent ? 880 : 600, 'sine', 0.06, urgent ? 0.14 : 0.06);
    }

    function playFanfare() {
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((n, i) => {
        setTimeout(() => playTone(n, 'triangle', 0.3, 0.16), i * 120);
      });
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const icon = document.getElementById('soundIcon');
      icon.setAttribute('data-lucide', soundEnabled ? 'volume-2' : 'volume-x');
      lucide.createIcons();
    }

    // ==========================================
    // 2. BANK SOAL & DATA GAME YANKES BADUNG
    // ==========================================
    const ROUND1_QUESTIONS = [
      {
        q: "Kalau rapat evaluasi pelayanan mendadak molor lewat jam makan siang, menu penyelamat paling kompak tim kita adalah...",
        options: ["Nasi Jinggo / Nasi Campur Bali", "Ayam Geprek / Lalapan", "Bakso / Mie Ayam", "Kopi Susu & Gorengan Dulu"]
      },
      {
        q: "Saat berkas pengajuan perizinan klinik masuk menumpuk di akhir bulan, reaksi pertama tim Yankes biasanya...",
        options: ["Langsung bagi tugas cek kelengkapan", "Tarik napas sambil seduh kopi/teh", "Cek sistem SIPERKLIN & OSS bareng", "Koordinasi jadwal visitasi lapangan"]
      },
      {
        q: "Aplikasi atau alat kerja yang paling wajib terbuka pertama kali di layar komputer/HP pagi hari...",
        options: ["WhatsApp Web / Grup Koordinasi", "Portal SIPERKLIN / OSS", "Spreadsheet / Laporan Kegiatan", "Email Dinas & E-Surat"]
      },
      {
        q: "Kalau ada jadwal visitasi lapangan ke wilayah Badung Selatan (Kuta/Nusa Dua) di jam macet, strategi tim adalah...",
        options: ["Berangkat lebih pagi bareng 1 mobil", "Lewat Tol Bali Mandara biar sat-set", "Mampir sarapan/ngopi dekat lokasi dulu", "Siapkan checklist berkas di jalan"]
      },
      {
        q: "Kata penyemangat andalan saat tim sedang kejar target akreditasi atau laporan triwulan...",
        options: ["Astungkara astiti bhakti, pasti kelar!", "Gas pol, jangan kasih kendor!", "Kerja bareng biar cepat pulang", "Yang penting data valid & rapi"]
      }
    ];

    const ROUND2_WORDS = [
      { word: "PUSKESMAS", tabu: ["Klinik", "Kecamatan", "Dokter", "Berobat", "Kesehatan"] },
      { word: "AKREDITASI", tabu: ["Nilai", "Paripurna", "Survei", "Standar", "Mutu"] },
      { word: "RUJUKAN", tabu: ["Rumah Sakit", "Surat", "Pasien", "Pindah", "BPJS"] },
      { word: "SIPERKLIN", tabu: ["Klinik", "Izin", "Online", "Badung", "Rekomendasi"] },
      { word: "VISITASI", tabu: ["Lapangan", "Cek", "Kunjungan", "Tim", "Lokasi"] },
      { word: "MANGUSADA", tabu: ["RSD", "Kapal", "Rumah Sakit", "Badung", "Pemerintah"] },
      { word: "REKAM MEDIS", tabu: ["Pasien", "Catatan", "Riwayat", "Elektronik", "Dokter"] },
      { word: "APOTEK", tabu: ["Obat", "Resep", "Farmasi", "Beli", "Apoteker"] },
      { word: "AMBULANS", tabu: ["Mobil", "Sirine", "Darurat", "Pasien", "Sirene"] },
      { word: "LABORATORIUM", tabu: ["Darah", "Tes", "Cek", "Sampel", "Hasil"] },
      { word: "SURVEI KEPUASAN", tabu: ["SKM", "Nilai", "Masyarakat", "Kuesioner", "Pelayanan"] },
      { word: "IZIN OPERASIONAL", tabu: ["OSS", "Surat", "Buka", "Klinik", "Resmi"] }
    ];

    const ROUND3_SCENARIOS = [
      {
        title: "Kasus 1: Pemohon Perizinan Bingung Upload Dokumen",
        desc: "Seorang penanggung jawab klinik datang ke loket pelayanan dengan berkas fisik lengkap, namun kesulitan mengunggah 28 dokumen PDF ke sistem online karena ukuran file terlalu besar. Langkah paling kompak & solutif tim?",
        options: [
          { text: "Bantu kompres PDF di tempat & pandu langkah demi langkah di meja layanan", score: 100, tag: "Pelayanan Prima & Solutif" },
          { text: "Berikan brosur panduan lalu minta pemohon mencoba lagi dari rumah", score: 40, tag: "Kurang Responsif" },
          { text: "Terima berkas fisiknya saja tanpa input ke sistem", score: 20, tag: "Melanggar Prosedur Digital" }
        ]
      },
      {
        title: "Kasus 2: Jadwal Visitasi Lapangan Bentrok dengan Rapat Mendadak",
        desc: "30 menit sebelum tim berangkat visitasi ke fasyankes di Mengwi, ada undangan rapat koordinasi mendadak di kantor Dinas. Bagaimana pembagian peran tim?",
        options: [
          { text: "Bagi tim menjadi dua: sebagian tetap visitasi sesuai janji pemohon, sebagian hadiri rapat", score: 100, tag: "Delegasi & Komitmen Tinggi" },
          { text: "Batalkan visitasi sepihak saat tim sudah di jalan", score: 30, tag: "Mengecewakan Pemohon" },
          { text: "Semua ikut rapat dan menunda visitasi hingga bulan depan", score: 20, tag: "Menghambat SLA Layanan" }
        ]
      },
      {
        title: "Kasus 3: Laporan Insiden Keselamatan Pasien dari Fasyankes",
        desc: "Diterima laporan kendala pelayanan darurat di salah satu fasilitas kesehatan wilayah Badung pada sore hari. Sikap tim Yankes?",
        options: [
          { text: "Segera verifikasi fakta lapangan, koordinasi pimpinan, & kawal tindak lanjut perbaikan", score: 100, tag: "Sigap & Akuntabel" },
          { text: "Tunggu laporan resmi tertulis minggu depan baru dibahas", score: 40, tag: "Terlalu Lambat" },
          { text: "Abaikan karena sudah mendekati jam pulang kantor", score: 10, tag: "Tidak Profesional" }
        ]
      }
    ];

    // ==========================================
    // 3. STATE MANAGEMENT & LOCAL STORAGE
    // ==========================================
    const STORAGE_KEY = 'yankes_badung_game_history_v2';
    const ADMIN_PIN = '1234'; // PIN Default Admin Yankes

    let state = {
      screen: 'setup', // setup, round1, round2, round3, summary
      mode: 'single', // single | multi
      teams: [
        {
          id: 1,
          name: 'Tim Pelayanan Kesehatan',
          members: ['Staf 1', 'Staf 2', 'Staf 3', 'Staf 4'],
          score: 0,
          r1Harmony: 0,
          r1Points: 0,
          r1Details: [], // menyimpan riwayat pertanyaan & jawaban per anggota
          r2Words: 0,
          r2Points: 0,
          r3Score: 0,
          r3Choice: '-'
        }
      ],
      activeTeamIdx: 0,
      // Round 1 state
      r1QIdx: 0,
      r1TurnMemberIdx: 0,
      r1Answers: [],
      r1Revealed: false,
      // Round 2 state
      r2Timer: 60,
      r2Interval: null,
      r2WordIdx: 0,
      r2Running: false,
      r2SessionScore: 0,
      r2CorrectCount: 0,
      // Round 3 state
      r3Idx: 0,
      r3Timer: 15,
      r3Interval: null,
      r3SelectedOption: null,
      // Admin state
      adminLoggedIn: false,
      expandedSessionId: null
    };

    function getHistory() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      } catch (e) {
        return [];
      }
    }

    function saveSessionToHistory() {
      const history = getHistory();
      const totalHarmony = Math.round(
        state.teams.reduce((acc, t) => acc + t.r1Harmony, 0) / state.teams.length
      );
      const record = {
        id: 'SESI-' + Date.now().toString().slice(-6),
        timestamp: new Date().toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }),
        mode: state.mode === 'single' ? '1 Tim Besar' : `${state.teams.length} Sub-Tim`,
        avgHarmony: totalHarmony,
        teams: state.teams.map(t => ({
          name: t.name,
          members: [...t.members],
          score: t.score,
          r1Harmony: t.r1Harmony,
          r1Points: t.r1Points,
          r1Details: t.r1Details || [],
          r2Words: t.r2Words,
          r2Points: t.r2Points,
          r3Score: t.r3Score,
          r3Choice: t.r3Choice || '-',
          predicate: getPredicate(t.score).title
        }))
      };
      history.unshift(record);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    }

    function getPredicate(score) {
      if (score >= 220) return { title: "Sangat Kompak & Satu Frekuensi!", badge: "bg-emerald-100 text-emerald-800 border-emerald-200", emoji: "🏆" };
      if (score >= 150) return { title: "Solid & Sinergis", badge: "bg-sky-100 text-sky-800 border-sky-200", emoji: "🤝" };
      return { title: "Perlu Ngopi Bareng Lagi", badge: "bg-amber-100 text-amber-800 border-amber-200", emoji: "☕" };
    }

    function clearTimers() {
      if (state.r2Interval) { clearInterval(state.r2Interval); state.r2Interval = null; }
      if (state.r3Interval) { clearInterval(state.r3Interval); state.r3Interval = null; }
    }

    function goHome() {
      clearTimers();
      state.screen = 'setup';
      render();
    }

    // ==========================================
    // 4. SCREEN RENDERERS
    // ==========================================
    function render() {
      const app = document.getElementById('app');
      if (state.screen === 'setup') app.innerHTML = renderSetup();
      else if (state.screen === 'round1') app.innerHTML = renderRound1();
      else if (state.screen === 'round2') app.innerHTML = renderRound2();
      else if (state.screen === 'round3') app.innerHTML = renderRound3();
      else if (state.screen === 'summary') app.innerHTML = renderSummary();
      lucide.createIcons();
    }

    // --- SCREEN 1: SETUP TIM ---
    function renderSetup() {
      return `
        <div class="glass-card rounded-3xl p-6 sm:p-8">
          <div class="text-center max-w-2xl mx-auto mb-8">
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-sky-100 text-sky-700 text-xs font-bold mb-3">
              <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> Ice Breaking &amp; Team Building
            </span>
            <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">
              Uji Kekompakan Tim Yankes
            </h2>
            <p class="text-sm text-slate-600 mt-2">
              Tiga tantangan interaktif untuk mengukur seberapa satu frekuensi tim Anda dalam keseharian kantor maupun pelayanan publik.
            </p>
          </div>

          <!-- Pilih Mode -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
            <button onclick="setMode('single')" class="p-4 rounded-2xl border-2 text-left transition ${state.mode === 'single' ? 'border-sky-600 bg-sky-50/70' : 'border-slate-200 bg-white hover:border-slate-300'}">
              <div class="flex items-center justify-between mb-1">
                <span class="font-bold text-slate-900">Mode 1 Tim Besar</span>
                <i data-lucide="users" class="w-5 h-5 text-sky-600"></i>
              </div>
              <p class="text-xs text-slate-500">Cocok untuk ice breaking seluruh staf dalam satu sesi bersama.</p>
            </button>

            <button onclick="setMode('multi')" class="p-4 rounded-2xl border-2 text-left transition ${state.mode === 'multi' ? 'border-sky-600 bg-sky-50/70' : 'border-slate-200 bg-white hover:border-slate-300'}">
              <div class="flex items-center justify-between mb-1">
                <span class="font-bold text-slate-900">Mode Kompetisi (2–4 Tim)</span>
                <i data-lucide="trophy" class="w-5 h-5 text-amber-500"></i>
              </div>
              <p class="text-xs text-slate-500">Adu kekompakan antar sub-tim / kelompok kerja untuk meraih skor tertinggi.</p>
            </button>
          </div>

          <!-- Konfigurasi Tim -->
          <div class="space-y-4 mb-8">
            <div class="flex items-center justify-between">
              <h3 class="text-sm font-bold text-slate-700 uppercase tracking-wider">Daftar Tim &amp; Anggota</h3>
              ${state.mode === 'multi' && state.teams.length < 4 ? `
                <button onclick="addTeam()" class="inline-flex items-center gap-1 text-xs font-bold text-sky-600 hover:text-sky-700 bg-sky-50 px-3 py-1.5 rounded-lg">
                  <i data-lucide="plus" class="w-3.5 h-3.5"></i> Tambah Tim
                </button>
              ` : ''}
            </div>

            <div class="grid grid-cols-1 ${state.mode === 'multi' ? 'md:grid-cols-2' : ''} gap-4">
              ${state.teams.map((t, idx) => `
                <div class="p-4 rounded-2xl bg-white border border-slate-200 shadow-sm">
                  <div class="flex items-center justify-between gap-2 mb-3">
                    <input type="text" value="${t.name}" onchange="updateTeamName(${idx}, this.value)"
                      class="font-bold text-slate-900 bg-slate-50 border border-slate-200 rounded-lg px-3 py-1.5 text-sm w-full focus:outline-none focus:border-sky-500"
                      placeholder="Nama Tim" />
                    ${state.mode === 'multi' && state.teams.length > 2 ? `
                      <button onclick="removeTeam(${idx})" class="p-1.5 text-rose-500 hover:bg-rose-50 rounded-lg">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                      </button>
                    ` : ''}
                  </div>
                  <label class="block text-[11px] font-semibold text-slate-500 mb-1">Nama Anggota (pisahkan dengan koma):</label>
                  <input type="text" value="${t.members.join(', ')}" onchange="updateTeamMembers(${idx}, this.value)"
                    class="text-xs text-slate-700 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 w-full focus:outline-none focus:border-sky-500"
                    placeholder="Contoh: Gus Satya, Tugek Anya, Ayu, Made" />
                </div>
              `).join('')}
            </div>
          </div>

          <button onclick="startGame()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-sky-600 to-teal-500 hover:from-sky-700 hover:to-teal-600 text-white font-extrabold text-base shadow-lg shadow-sky-500/25 flex items-center justify-center gap-2 transition transform active:scale-[0.99]">
            <i data-lucide="play" class="w-5 h-5 fill-current"></i>
            <span>Mulai Tantangan Kekompakan</span>
          </button>
        </div>
      `;
    }

    function createBlankTeam(id, name, members) {
      return {
        id,
        name,
        members,
        score: 0,
        r1Harmony: 0,
        r1Points: 0,
        r1Details: [],
        r2Words: 0,
        r2Points: 0,
        r3Score: 0,
        r3Choice: '-'
      };
    }

    function setMode(mode) {
      state.mode = mode;
      if (mode === 'single') {
        state.teams = [createBlankTeam(1, 'Tim Pelayanan Kesehatan', ['Anggota 1', 'Anggota 2', 'Anggota 3', 'Anggota 4'])];
      } else if (state.teams.length < 2) {
        state.teams = [
          createBlankTeam(1, 'Tim Perizinan', ['Anggota A1', 'Anggota A2', 'Anggota A3']),
          createBlankTeam(2, 'Tim Mutu & Akreditasi', ['Anggota B1', 'Anggota B2', 'Anggota B3'])
        ];
      }
      render();
    }

    function addTeam() {
      if (state.teams.length >= 4) return;
      const n = state.teams.length + 1;
      state.teams.push(createBlankTeam(Date.now(), `Tim Yankes ${n}`, [`Anggota ${n}A`, `Anggota ${n}B`, `Anggota ${n}C`]));
      render();
    }

    function removeTeam(idx) {
      state.teams.splice(idx, 1);
      render();
    }

    function updateTeamName(idx, val) {
      state.teams[idx].name = val.trim() || `Tim ${idx + 1}`;
    }

    function updateTeamMembers(idx, val) {
      const list = val.split(',').map(s => s.trim()).filter(Boolean);
      state.teams[idx].members = list.length >= 2 ? list : ['Anggota 1', 'Anggota 2'];
    }

    function startGame() {
      initAudio();
      playSuccess();
      state.teams.forEach(t => {
        t.score = 0;
        t.r1Harmony = 0;
        t.r1Points = 0;
        t.r1Details = [];
        t.r2Words = 0;
        t.r2Points = 0;
        t.r3Score = 0;
        t.r3Choice = '-';
      });
      state.activeTeamIdx = 0;
      state.r1QIdx = 0;
      state.r1TurnMemberIdx = 0;
      state.r1Answers = [];
      state.r1Revealed = false;
      state.screen = 'round1';
      render();
    }

    // --- SCREEN 2: RONDE 1 (SATU FREKUENSI) ---
    function renderRound1() {
      const team = state.teams[state.activeTeamIdx];
      const question = ROUND1_QUESTIONS[state.r1QIdx % ROUND1_QUESTIONS.length];
      const currentMember = team.members[state.r1TurnMemberIdx];

      let harmonyPct = 0;
      let topAnswer = '';
      if (state.r1Revealed) {
        const counts = {};
        state.r1Answers.forEach(a => { counts[a.answer] = (counts[a.answer] || 0) + 1; });
        let maxCount = 0;
        for (const [ans, cnt] of Object.entries(counts)) {
          if (cnt > maxCount) { maxCount = cnt; topAnswer = ans; }
        }
        harmonyPct = Math.round((maxCount / state.r1Answers.length) * 100);
      }

      return `
        <div class="space-y-4">
          ${renderScoreBar('Ronde 1: Satu Frekuensi', 'Pilih jawaban secara rahasia bergantian untuk mengukur kesamaan selera & insting tim.')}

          <div class="glass-card rounded-3xl p-6 sm:p-8">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
              <span class="px-3 py-1 rounded-full bg-sky-100 text-sky-800 text-xs font-bold">
                Giliran: ${team.name}
              </span>
              <span class="text-xs font-semibold text-slate-500">
                Pertanyaan ${state.r1QIdx + 1} dari ${ROUND1_QUESTIONS.length}
              </span>
            </div>

            <h3 class="text-lg sm:text-xl font-extrabold text-slate-900 mb-6 leading-snug">
              "${question.q}"
            </h3>

            ${!state.r1Revealed ? `
              <div class="p-4 rounded-2xl bg-amber-50 border border-amber-200 mb-6 flex items-center justify-between">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 rounded-full bg-amber-500 text-white font-bold flex items-center justify-center">
                    ${state.r1TurnMemberIdx + 1}
                  </div>
                  <div>
                    <p class="text-xs text-amber-800 font-semibold">Giliran Menjawab Rahasia:</p>
                    <p class="text-base font-extrabold text-slate-900">${currentMember}</p>
                  </div>
                </div>
                <span class="text-xs font-bold text-amber-700 bg-amber-100 px-2.5 py-1 rounded-lg">
                  ${state.r1TurnMemberIdx + 1} / ${team.members.length} Anggota
                </span>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                ${question.options.map((opt, i) => `
                  <button onclick="submitR1Answer(${i})" class="p-4 rounded-2xl border-2 border-slate-200 bg-white hover:border-sky-500 hover:bg-sky-50 text-left font-semibold text-sm text-slate-800 transition flex items-center gap-3">
                    <span class="w-7 h-7 rounded-lg bg-slate-100 text-slate-700 font-bold text-xs flex items-center justify-center shrink-0">
                      ${String.fromCharCode(65 + i)}
                    </span>
                    <span>${opt}</span>
                  </button>
                `).join('')}
              </div>
            ` : `
              <div class="p-5 rounded-2xl bg-gradient-to-br from-sky-600 to-teal-600 text-white mb-6 text-center">
                <p class="text-xs uppercase tracking-wider font-bold text-sky-100">Tingkat Kekompakan Pertanyaan Ini</p>
                <div class="text-4xl sm:text-5xl font-black my-1">${harmonyPct}%</div>
                <p class="text-xs text-sky-100">Jawaban Paling Kompak: <strong class="text-white">${topAnswer}</strong> (+${harmonyPct} Poin)</p>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 mb-6">
                ${state.r1Answers.map(a => `
                  <div class="p-3 rounded-xl border ${a.answer === topAnswer ? 'bg-emerald-50 border-emerald-200' : 'bg-slate-50 border-slate-200'} flex items-center justify-between">
                    <span class="font-bold text-xs text-slate-700">${a.member}</span>
                    <span class="text-xs font-semibold ${a.answer === topAnswer ? 'text-emerald-700' : 'text-slate-600'}">${a.answer}</span>
                  </div>
                `).join('')}
              </div>

              <button onclick="nextR1Step()" class="w-full py-3.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm transition">
                Lanjutkan
              </button>
            `}
          </div>
        </div>
      `;
    }

    function submitR1Answer(optIdx) {
      const team = state.teams[state.activeTeamIdx];
      const question = ROUND1_QUESTIONS[state.r1QIdx % ROUND1_QUESTIONS.length];
      playTone(620, 'sine', 0.1, 0.12);

      state.r1Answers.push({
        member: team.members[state.r1TurnMemberIdx],
        answer: question.options[optIdx]
      });

      if (state.r1TurnMemberIdx + 1 < team.members.length) {
        state.r1TurnMemberIdx++;
      } else {
        const counts = {};
        state.r1Answers.forEach(a => { counts[a.answer] = (counts[a.answer] || 0) + 1; });
        let maxCount = 0;
        let topAnswer = '';
        for (const [ans, cnt] of Object.entries(counts)) {
          if (cnt > maxCount) { maxCount = cnt; topAnswer = ans; }
        }
        const harmonyPct = Math.round((maxCount / state.r1Answers.length) * 100);

        team.score += harmonyPct;
        team.r1Points += harmonyPct;
        team.r1Harmony = team.r1Harmony ? Math.round((team.r1Harmony + harmonyPct) / 2) : harmonyPct;
        team.r1Details.push({
          question: question.q,
          harmonyPct,
          topAnswer,
          answers: [...state.r1Answers]
        });

        state.r1Revealed = true;
        playSuccess();
      }
      render();
    }

    function nextR1Step() {
      state.r1Answers = [];
      state.r1TurnMemberIdx = 0;
      state.r1Revealed = false;

      if (state.mode === 'multi' && state.activeTeamIdx + 1 < state.teams.length) {
        state.activeTeamIdx++;
        state.r1QIdx++;
      } else if (state.mode === 'single' && state.r1QIdx < 1) {
        state.r1QIdx++;
      } else {
        state.activeTeamIdx = 0;
        state.r2Timer = 60;
        state.r2Running = false;
        state.r2SessionScore = 0;
        state.r2CorrectCount = 0;
        state.screen = 'round2';
      }
      render();
    }

    // --- SCREEN 3: RONDE 2 (ESTAFET KATA KUNCI) ---
    function renderRound2() {
      const team = state.teams[state.activeTeamIdx];
      const item = ROUND2_WORDS[state.r2WordIdx % ROUND2_WORDS.length];

      return `
        <div class="space-y-4">
          ${renderScoreBar('Ronde 2: Estafet Kata Kunci', 'Satu orang memberi petunjuk verbal tanpa menyebut kata tabu, anggota tim lainnya menebak cepat!')}

          <div class="glass-card rounded-3xl p-6 sm:p-8 text-center">
            <div class="flex items-center justify-between mb-6">
              <span class="px-3 py-1 rounded-full bg-teal-100 text-teal-800 text-xs font-bold">
                Giliran: ${team.name}
              </span>
              <div class="flex items-center gap-2 px-4 py-1.5 rounded-full font-extrabold text-sm ${state.r2Timer <= 10 ? 'bg-rose-100 text-rose-600 animate-pulse-fast' : 'bg-slate-100 text-slate-800'}">
                <i data-lucide="timer" class="w-4 h-4"></i>
                <span>${state.r2Timer} Detik</span>
              </div>
            </div>

            ${!state.r2Running && state.r2Timer === 60 ? `
              <div class="py-8 max-w-md mx-auto">
                <div class="w-16 h-16 rounded-2xl bg-teal-100 text-teal-600 flex items-center justify-center mx-auto mb-4">
                  <i data-lucide="message-square-quote" class="w-8 h-8"></i>
                </div>
                <h3 class="text-xl font-extrabold text-slate-900 mb-2">Siap Estafet Kata, ${team.name}?</h3>
                <p class="text-xs text-slate-600 mb-6">
                  Tunjuk 1 juru bicara untuk melihat layar dan menjelaskan kata kunci kesehatan kepada tim dalam waktu <strong>60 detik</strong>. Benar <strong>+10 poin</strong>, Lewati <strong>-5 poin</strong>.
                </p>
                <button onclick="startR2Timer()" class="px-8 py-3.5 rounded-2xl bg-teal-600 hover:bg-teal-700 text-white font-extrabold text-sm shadow-lg shadow-teal-500/25 transition">
                  Mulai Hitung Mundur 60 Detik
                </button>
              </div>
            ` : state.r2Timer > 0 ? `
              <div class="max-w-md mx-auto">
                <div class="p-6 rounded-2xl bg-slate-900 text-white shadow-xl mb-5">
                  <p class="text-[11px] uppercase tracking-widest text-teal-400 font-bold mb-1">Kata Utama (Jelaskan!)</p>
                  <div class="text-3xl sm:text-4xl font-black tracking-wide mb-5">${item.word}</div>

                  <div class="border-t border-slate-700 pt-4">
                    <p class="text-[11px] uppercase tracking-wider text-rose-400 font-bold mb-2">Kata Tabu (Dilarang Diucapkan):</p>
                    <div class="flex flex-wrap justify-center gap-1.5">
                      ${item.tabu.map(w => `<span class="px-2.5 py-1 rounded-md bg-rose-500/20 text-rose-200 text-xs font-semibold border border-rose-500/30">${w}</span>`).join('')}
                    </div>
                  </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                  <button onclick="r2Skip()" class="py-3.5 rounded-xl bg-amber-100 hover:bg-amber-200 text-amber-900 font-extrabold text-sm transition">
                    Lewati (-5)
                  </button>
                  <button onclick="r2Correct()" class="py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-sm shadow-md transition">
                    Benar! (+10)
                  </button>
                </div>
                <p class="text-xs font-bold text-slate-500 mt-4">Skor Sesi Ini: ${state.r2SessionScore} Poin (${state.r2CorrectCount} Kata Tertebak)</p>
              </div>
            ` : `
              <div class="py-6">
                <h3 class="text-2xl font-extrabold text-slate-900 mb-1">Waktu Habis!</h3>
                <p class="text-sm text-slate-600 mb-4">${team.name} berhasil menebak <strong>${state.r2CorrectCount} kata</strong> dengan tambahan <strong>${Math.max(0, state.r2SessionScore)} poin</strong>.</p>
                <button onclick="nextR2Team()" class="px-8 py-3.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm">
                  Lanjutkan
                </button>
              </div>
            `}
          </div>
        </div>
      `;
    }

    function startR2Timer() {
      initAudio();
      state.r2Running = true;
      state.r2Interval = setInterval(() => {
        state.r2Timer--;
        if (state.r2Timer <= 10 && state.r2Timer > 0) playTick(true);
        if (state.r2Timer <= 0) {
          clearTimers();
          state.r2Running = false;
          const finalAdd = Math.max(0, state.r2SessionScore);
          state.teams[state.activeTeamIdx].score += finalAdd;
          state.teams[state.activeTeamIdx].r2Points = finalAdd;
          state.teams[state.activeTeamIdx].r2Words = state.r2CorrectCount;
          playFanfare();
        }
        render();
      }, 1000);
      render();
    }

    function r2Correct() {
      playSuccess();
      state.r2SessionScore += 10;
      state.r2CorrectCount++;
      state.r2WordIdx++;
      render();
    }

    function r2Skip() {
      playError();
      state.r2SessionScore -= 5;
      state.r2WordIdx++;
      render();
    }

    function nextR2Team() {
      if (state.activeTeamIdx + 1 < state.teams.length) {
        state.activeTeamIdx++;
        state.r2Timer = 60;
        state.r2Running = false;
        state.r2SessionScore = 0;
        state.r2CorrectCount = 0;
      } else {
        state.activeTeamIdx = 0;
        state.r3Idx = 0;
        state.r3SelectedOption = null;
        state.screen = 'round3';
        startR3Timer();
      }
      render();
    }

    // --- SCREEN 4: RONDE 3 (MISI DARURAT PELAYANAN) ---
    function renderRound3() {
      const team = state.teams[state.activeTeamIdx];
      const scenario = ROUND3_SCENARIOS[state.r3Idx % ROUND3_SCENARIOS.length];

      return `
        <div class="space-y-4">
          ${renderScoreBar('Ronde 3: Misi Darurat Pelayanan', 'Diskusikan bersama tim dan putuskan tindakan terbaik dalam 15 detik!')}

          <div class="glass-card rounded-3xl p-6 sm:p-8">
            <div class="flex items-center justify-between mb-4">
              <span class="px-3 py-1 rounded-full bg-indigo-100 text-indigo-800 text-xs font-bold">
                Tim: ${team.name}
              </span>
              <div class="flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-extrabold ${state.r3Timer <= 5 ? 'bg-rose-100 text-rose-600 animate-pulse-fast' : 'bg-slate-100 text-slate-700'}">
                <i data-lucide="clock" class="w-3.5 h-3.5"></i>
                <span>${state.r3Timer} Detik</span>
              </div>
            </div>

            <h3 class="text-lg font-extrabold text-slate-900 mb-2">${scenario.title}</h3>
            <p class="text-sm text-slate-600 leading-relaxed mb-6">${scenario.desc}</p>

            <div class="space-y-3">
              ${scenario.options.map((opt, idx) => {
                const isSelected = state.r3SelectedOption === idx;
                let btnStyle = 'border-slate-200 bg-white hover:border-indigo-400';
                if (state.r3SelectedOption !== null) {
                  if (opt.score === 100) btnStyle = 'border-emerald-500 bg-emerald-50 text-emerald-900';
                  else if (isSelected) btnStyle = 'border-amber-500 bg-amber-50 text-amber-900';
                  else btnStyle = 'border-slate-200 bg-slate-50 opacity-60';
                }
                return `
                  <button ${state.r3SelectedOption !== null ? 'disabled' : ''} onclick="selectR3Option(${idx})"
                    class="w-full p-4 rounded-2xl border-2 text-left transition flex items-center justify-between gap-3 ${btnStyle}">
                    <span class="text-sm font-semibold">${opt.text}</span>
                    ${state.r3SelectedOption !== null ? `
                      <span class="shrink-0 text-xs font-extrabold px-2.5 py-1 rounded-lg bg-white shadow-sm">
                        +${opt.score} Poin
                      </span>
                    ` : ''}
                  </button>
                `;
              }).join('')}
            </div>

            ${state.r3SelectedOption !== null ? `
              <div class="mt-6 flex justify-end">
                <button onclick="nextR3Step()" class="px-6 py-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm">
                  ${state.activeTeamIdx + 1 < state.teams.length ? 'Giliran Tim Berikutnya' : 'Lihat Hasil Akhir Kekompakan'}
                </button>
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }

    function startR3Timer() {
      clearTimers();
      state.r3Timer = 15;
      state.r3Interval = setInterval(() => {
        state.r3Timer--;
        if (state.r3Timer <= 5 && state.r3Timer > 0) playTick(true);
        if (state.r3Timer <= 0) {
          clearTimers();
          if (state.r3SelectedOption === null) {
            selectR3Option(1);
          }
        }
        render();
      }, 1000);
    }

    function selectR3Option(idx) {
      clearTimers();
      state.r3SelectedOption = idx;
      const scenario = ROUND3_SCENARIOS[state.r3Idx % ROUND3_SCENARIOS.length];
      const chosen = scenario.options[idx];
      const team = state.teams[state.activeTeamIdx];
      team.score += chosen.score;
      team.r3Score = chosen.score;
      team.r3Choice = `${chosen.tag} (${chosen.text})`;
      if (chosen.score === 100) playSuccess();
      else playError();
      render();
    }

    function nextR3Step() {
      if (state.activeTeamIdx + 1 < state.teams.length) {
        state.activeTeamIdx++;
        state.r3Idx++;
        state.r3SelectedOption = null;
        startR3Timer();
      } else {
        saveSessionToHistory();
        state.screen = 'summary';
        playFanfare();
        if (typeof confetti === 'function') {
          confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } });
        }
      }
      render();
    }

    // --- SCREEN 5: HASIL AKHIR & KLASEMEN ---
    function renderSummary() {
      const sorted = [...state.teams].sort((a, b) => b.score - a.score);

      return `
        <div class="glass-card rounded-3xl p-6 sm:p-8 text-center">
          <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-100 text-emerald-800 text-xs font-bold mb-3">
            <i data-lucide="check-circle-2" class="w-4 h-4"></i> Semua Hasil Tersimpan ke Dashboard
          </div>
          <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 mb-2">Rekapitulasi Kekompakan Tim</h2>
          <p class="text-sm text-slate-600 mb-8">Evaluasi sinergi berdasarkan kesamaan frekuensi, kecepatan komunikasi, dan ketepatan keputusan.</p>

          <div class="space-y-4 max-w-2xl mx-auto mb-8 text-left">
            ${sorted.map((t, idx) => {
              const pred = getPredicate(t.score);
              return `
                <div class="p-5 rounded-2xl bg-white border-2 ${idx === 0 ? 'border-amber-400 shadow-md' : 'border-slate-200'}">
                  <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                    <div class="flex items-center gap-2.5">
                      <span class="w-8 h-8 rounded-xl ${idx === 0 ? 'bg-amber-400 text-slate-900' : 'bg-slate-100 text-slate-700'} font-black text-sm flex items-center justify-center">
                        #${idx + 1}
                      </span>
                      <div>
                        <h3 class="font-extrabold text-slate-900">${t.name}</h3>
                        <p class="text-[11px] text-slate-500">${t.members.join(', ')}</p>
                      </div>
                    </div>
                    <div class="text-right">
                      <div class="text-2xl font-black text-sky-600">${t.score} <span class="text-xs font-bold text-slate-400">PTS</span></div>
                    </div>
                  </div>

                  <div class="flex flex-wrap items-center justify-between gap-2 pt-3 border-t border-slate-100">
                    <span class="px-3 py-1 rounded-full border text-xs font-bold ${pred.badge}">
                      ${pred.emoji} ${pred.title}
                    </span>
                    <div class="flex flex-wrap gap-3 text-[11px] font-semibold text-slate-500">
                      <span>R1 Frekuensi: <strong>${t.r1Harmony}% (+${t.r1Points})</strong></span>
                      <span>R2 Estafet: <strong>${t.r2Words} kata (+${t.r2Points})</strong></span>
                      <span>R3 Misi: <strong>+${t.r3Score}</strong></span>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          <div class="flex flex-wrap justify-center gap-3">
            <button onclick="openAdminModal()" class="px-6 py-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm flex items-center gap-2">
              <i data-lucide="layout-dashboard" class="w-4 h-4 text-teal-400"></i>
              <span>Lihat Semua Hasil di Dashboard</span>
            </button>
            <button onclick="goHome()" class="px-6 py-3 rounded-xl border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 font-bold text-sm">
              Main Lagi
            </button>
          </div>
        </div>
      `;
    }

    function renderScoreBar(title, subtitle) {
      return `
        <div class="glass-card rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3">
          <div>
            <h2 class="font-extrabold text-sm sm:text-base text-slate-900">${title}</h2>
            <p class="text-xs text-slate-500">${subtitle}</p>
          </div>
          <div class="flex flex-wrap gap-2">
            ${state.teams.map((t, idx) => `
              <div class="px-3 py-1.5 rounded-xl text-xs font-bold border ${idx === state.activeTeamIdx ? 'bg-sky-600 text-white border-sky-600' : 'bg-white text-slate-700 border-slate-200'}">
                ${t.name}: <span class="font-black">${t.score}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // ==========================================
    // 5. ADMIN DASHBOARD (SEMUA HASIL LENGKAP) & EXPORT CSV
    // ==========================================
    function openAdminModal() {
      document.getElementById('adminModal').classList.remove('hidden');
      renderAdminBody();
    }

    function closeAdminModal() {
      document.getElementById('adminModal').classList.add('hidden');
    }

    function toggleSessionDetail(sessionId) {
      state.expandedSessionId = state.expandedSessionId === sessionId ? null : sessionId;
      renderAdminBody();
    }

    function renderAdminBody() {
      const body = document.getElementById('adminModalBody');
      if (!state.adminLoggedIn) {
        body.innerHTML = `
          <div class="max-w-sm mx-auto py-8 text-center">
            <div class="w-14 h-14 rounded-2xl bg-slate-900 text-teal-400 flex items-center justify-center mx-auto mb-4">
              <i data-lucide="lock" class="w-7 h-7"></i>
            </div>
            <h3 class="text-lg font-extrabold text-slate-900 mb-1">Verifikasi Akses Dashboard</h3>
            <p class="text-xs text-slate-500 mb-5">Masukkan PIN Admin Yankes untuk melihat seluruh rekapitulasi hasil &amp; ekspor laporan (PIN default: <strong>1234</strong>).</p>
            <input id="adminPinInput" type="password" maxlength="8" placeholder="••••"
              onkeydown="if(event.key==='Enter') verifyAdminPin()"
              class="w-full text-center tracking-[0.5em] text-xl font-black border-2 border-slate-200 rounded-xl py-3 mb-3 focus:outline-none focus:border-sky-600" />
            <p id="adminPinError" class="text-xs text-rose-600 font-semibold mb-3 hidden">PIN salah. Silakan coba lagi.</p>
            <button onclick="verifyAdminPin()" class="w-full py-3 rounded-xl bg-sky-600 hover:bg-sky-700 text-white font-bold text-sm">
              Buka Dashboard Hasil
            </button>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      const history = getHistory();
      const totalSessions = history.length;
      const allTeams = history.flatMap(h => h.teams);
      const totalTeamsCount = allTeams.length;
      const avgAllHarmony = totalSessions
        ? Math.round(history.reduce((acc, h) => acc + h.avgHarmony, 0) / totalSessions)
        : 0;
      const avgTotalScore = totalTeamsCount
        ? Math.round(allTeams.reduce((acc, t) => acc + t.score, 0) / totalTeamsCount)
        : 0;

      body.innerHTML = `
        <div class="space-y-6">
          <!-- 4 KPI Cards Ringkasan -->
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
            <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200">
              <p class="text-[11px] font-semibold text-slate-500">Total Sesi Bermain</p>
              <p class="text-2xl font-black text-slate-900 mt-1">${totalSessions} <span class="text-xs font-medium text-slate-400">Sesi</span></p>
            </div>
            <div class="p-4 rounded-2xl bg-indigo-50 border border-indigo-200">
              <p class="text-[11px] font-semibold text-indigo-700">Total Tim Terevaluasi</p>
              <p class="text-2xl font-black text-indigo-950 mt-1">${totalTeamsCount} <span class="text-xs font-medium text-indigo-400">Tim</span></p>
            </div>
            <div class="p-4 rounded-2xl bg-sky-50 border border-sky-200">
              <p class="text-[11px] font-semibold text-sky-700">Rata-Rata Satu Frekuensi</p>
              <p class="text-2xl font-black text-sky-900 mt-1">${avgAllHarmony}%</p>
            </div>
            <div class="p-4 rounded-2xl bg-teal-50 border border-teal-200 flex flex-col justify-between">
              <div>
                <p class="text-[11px] font-semibold text-teal-700">Rata-Rata Skor Total</p>
                <p class="text-xl font-black text-teal-950">${avgTotalScore} <span class="text-xs font-normal">PTS</span></p>
              </div>
              <button onclick="exportHistoryCSV()" ${totalSessions === 0 ? 'disabled' : ''} class="mt-2 w-full py-1.5 rounded-lg bg-teal-600 hover:bg-teal-700 disabled:opacity-40 text-white text-[11px] font-bold flex items-center justify-center gap-1">
                <i data-lucide="download" class="w-3.5 h-3.5"></i> Unduh CSV Lengkap
              </button>
            </div>
          </div>

          <!-- Tabel Rekapitulasi Seluruh Hasil -->
          <div>
            <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
              <div>
                <h4 class="font-bold text-sm text-slate-800">Rekapitulasi Seluruh Hasil Permainan &amp; Rincian Ronde</h4>
                <p class="text-[11px] text-slate-500">Klik tombol <strong>"Lihat Rincian"</strong> pada setiap sesi untuk melihat jawaban detail masing-masing anggota tim.</p>
              </div>
              ${totalSessions > 0 ? `
                <button onclick="clearHistory()" class="text-xs font-semibold text-rose-600 hover:underline">Hapus Semua Data</button>
              ` : ''}
            </div>

            ${totalSessions === 0 ? `
              <div class="p-10 text-center rounded-2xl border border-dashed border-slate-300 text-slate-500 text-sm">
                Belum ada riwayat permainan yang selesai. Selesaikan 1 sesi permainan maka seluruh hasilnya otomatis tercatat di sini.
              </div>
            ` : `
              <div class="space-y-4">
                ${history.map(h => {
                  const isExpanded = state.expandedSessionId === h.id;
                  return `
                    <div class="border border-slate-200 rounded-2xl overflow-hidden bg-white shadow-xs">
                      <!-- Header Sesi -->
                      <div class="px-4 py-3 bg-slate-50 border-b border-slate-200 flex flex-wrap items-center justify-between gap-2">
                        <div class="flex items-center gap-2.5">
                          <span class="px-2.5 py-1 rounded-lg bg-slate-900 text-white font-bold text-xs">${h.id}</span>
                          <span class="text-xs font-semibold text-slate-600">${h.timestamp}</span>
                          <span class="px-2 py-0.5 rounded-md bg-sky-100 text-sky-800 text-[11px] font-bold">${h.mode}</span>
                        </div>
                        <button onclick="toggleSessionDetail('${h.id}')" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg bg-white border border-slate-300 hover:bg-slate-100 text-xs font-bold text-slate-700 transition">
                          <i data-lucide="${isExpanded ? 'chevron-up' : 'eye'}" class="w-3.5 h-3.5 text-sky-600"></i>
                          <span>${isExpanded ? 'Tutup Rincian' : 'Lihat Rincian Jawaban'}</span>
                        </button>
                      </div>

                      <!-- Tabel Skor per Tim dalam Sesi Ini -->
                      <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-xs">
                          <thead>
                            <tr class="bg-white text-slate-500 font-bold border-b border-slate-100 text-[11px] uppercase">
                              <th class="p-3">Tim &amp; Anggota</th>
                              <th class="p-3 text-center">R1: Frekuensi</th>
                              <th class="p-3 text-center">R2: Estafet Kata</th>
                              <th class="p-3 text-center">R3: Misi Pelayanan</th>
                              <th class="p-3 text-center">Total Skor</th>
                              <th class="p-3">Predikat Kekompakan</th>
                            </tr>
                          </thead>
                          <tbody class="divide-y divide-slate-100">
                            ${h.teams.map(t => `
                              <tr class="hover:bg-slate-50/80">
                                <td class="p-3">
                                  <span class="font-extrabold text-slate-900 block">${t.name}</span>
                                  <span class="text-[11px] text-slate-500">${t.members.join(', ')}</span>
                                </td>
                                <td class="p-3 text-center">
                                  <span class="font-bold text-sky-700 block">${t.r1Harmony}%</span>
                                  <span class="text-[10px] text-slate-400">(+${t.r1Points ?? t.r1Harmony} pts)</span>
                                </td>
                                <td class="p-3 text-center">
                                  <span class="font-bold text-teal-700 block">${t.r2Words} kata</span>
                                  <span class="text-[10px] text-slate-400">(+${t.r2Points ?? (t.r2Words * 10)} pts)</span>
                                </td>
                                <td class="p-3 text-center">
                                  <span class="font-bold text-indigo-700 block">+${t.r3Score} pts</span>
                                </td>
                                <td class="p-3 text-center">
                                  <span class="px-2.5 py-1 rounded-lg bg-slate-900 text-white font-black text-xs">${t.score}</span>
                                </td>
                                <td class="p-3">
                                  <span class="px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 font-bold text-[11px] inline-block">
                                    ${t.predicate}
                                  </span>
                                </td>
                              </tr>
                            `).join('')}
                          </tbody>
                        </table>
                      </div>

                      <!-- Panel Rincian Jawaban Anggota (Expandable) -->
                      ${isExpanded ? `
                        <div class="p-4 bg-sky-50/60 border-t border-sky-100 space-y-4">
                          <h5 class="font-extrabold text-xs uppercase tracking-wider text-sky-900">Detail Jawaban &amp; Keputusan Per Tim</h5>
                          ${h.teams.map(t => `
                            <div class="p-3.5 rounded-xl bg-white border border-sky-200/80 space-y-2.5">
                              <div class="font-bold text-xs text-slate-900 border-b border-slate-100 pb-1.5 flex items-center justify-between">
                                <span>${t.name}</span>
                                <span class="text-sky-700">Keputusan R3: ${t.r3Choice || '-'}</span>
                              </div>
                              ${t.r1Details && t.r1Details.length > 0 ? `
                                <div class="space-y-2">
                                  ${t.r1Details.map((d, qIdx) => `
                                    <div class="text-[11px] bg-slate-50 p-2.5 rounded-lg">
                                      <p class="font-semibold text-slate-700 mb-1">Q${qIdx + 1}: "${d.question}" — <span class="text-emerald-700 font-bold">Kompak ${d.harmonyPct}% (${d.topAnswer})</span></p>
                                      <div class="flex flex-wrap gap-1.5">
                                        ${d.answers.map(a => `
                                          <span class="px-2 py-0.5 rounded bg-white border border-slate-200 text-slate-600">
                                            <strong>${a.member}:</strong> ${a.answer}
                                          </span>
                                        `).join('')}
                                      </div>
                                    </div>
                                  `).join('')}
                                </div>
                              ` : `<p class="text-[11px] text-slate-400 italic">Detail jawaban per anggota tidak tersedia untuk sesi lama.</p>`}
                            </div>
                          `).join('')}
                        </div>
                      ` : ''}
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </div>

          <div class="pt-3 border-t border-slate-100 flex justify-between items-center">
            <span class="text-[11px] text-slate-400">Semua riwayat hasil tersimpan otomatis di browser perangkat ini.</span>
            <button onclick="adminLogout()" class="text-xs font-bold text-slate-600 hover:text-slate-900">Keluar Mode Admin</button>
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    function verifyAdminPin() {
      const val = document.getElementById('adminPinInput').value;
      if (val === ADMIN_PIN) {
        state.adminLoggedIn = true;
        playSuccess();
        renderAdminBody();
      } else {
        playError();
        document.getElementById('adminPinError').classList.remove('hidden');
      }
    }

    function adminLogout() {
      state.adminLoggedIn = false;
      renderAdminBody();
    }

    function clearHistory() {
      if (confirm('Hapus seluruh data riwayat kekompakan tim?')) {
        localStorage.removeItem(STORAGE_KEY);
        renderAdminBody();
      }
    }

    function exportHistoryCSV() {
      const history = getHistory();
      if (!history.length) return;
      const rows = [[
        'ID Sesi',
        'Waktu',
        'Mode',
        'Nama Tim',
        'Anggota',
        'R1 Satu Frekuensi (%)',
        'R1 Poin',
        'R2 Estafet Kata',
        'R2 Poin',
        'R3 Keputusan Pelayanan',
        'R3 Poin',
        'Total Skor',
        'Predikat Kekompakan'
      ]];
      history.forEach(h => {
        h.teams.forEach(t => {
          rows.push([
            h.id,
            `"${h.timestamp}"`,
            `"${h.mode}"`,
            `"${t.name}"`,
            `"${t.members.join('; ')}"`,
            t.r1Harmony,
            t.r1Points ?? t.r1Harmony,
            t.r2Words,
            t.r2Points ?? (t.r2Words * 10),
            `"${(t.r3Choice || '-').replace(/"/g, '""')}"`,
            t.r3Score,
            t.score,
            `"${t.predicate}"`
          ]);
        });
      });
      const csvContent = "data:text/csv;charset=utf-8," + rows.map(e => e.join(",")).join("\n");
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `rekap_lengkap_kekompakan_yankes_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // Initial render
    render();
  </script>
</body>
</html>
