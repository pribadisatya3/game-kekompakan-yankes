<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kekompakan Tim Yankes Badung</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top left, #f0f9ff, #e0f2fe 40%, #f8fafc 100%);
      min-height: 100vh;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.08);
    }
    @keyframes pulse-fast {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .animate-pulse-fast {
      animation: pulse-fast 0.8s infinite;
    }
  </style>
</head>
<body class="text-slate-800 antialiased selection:bg-sky-200 selection:text-sky-900">

  <!-- Top Navbar dengan Logo Memanjang -->
  <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-200/80 shadow-xs">
    <div class="max-w-5xl mx-auto px-4 py-2.5 flex items-center justify-between gap-3">
      
      <!-- Logo Bentuk Memanjang (Wide Horizontal Logo) -->
      <div onclick="goHome()" class="flex items-center gap-3 px-3.5 py-2 rounded-2xl bg-gradient-to-r from-slate-900 via-sky-950 to-teal-900 text-white shadow-md cursor-pointer hover:opacity-95 transition select-none max-w-full overflow-hidden">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-sky-400 to-teal-400 flex items-center justify-center text-slate-950 shrink-0 shadow-inner">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 2a2 2 0 0 0-2 2v5H4a2 2 0 0 0-2 2v2c0 1.1.9 2 2 2h5v5c0 1.1.9 2 2 2h2a2 2 0 0 0 2-2v-5h5a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2h-5V4a2 2 0 0 0-2-2h-2z"/>
          </svg>
        </div>

        <div class="h-7 w-[1.5px] bg-white/20 shrink-0"></div>

        <div class="flex flex-col sm:flex-row sm:items-center sm:gap-3 min-w-0">
          <div class="leading-none">
            <span class="font-extrabold text-sm sm:text-base tracking-wide text-white block">
              YANKES <span class="text-teal-300">BADUNG</span>
            </span>
            <span class="text-[10px] font-semibold text-sky-200/90 tracking-wider uppercase block mt-0.5">
              Dinas Kesehatan Kab. Badung
            </span>
          </div>

          <div class="hidden md:block h-5 w-[1px] bg-white/15"></div>

          <div class="hidden md:block text-[11px] font-medium text-slate-300 leading-tight">
            Bidang Pelayanan Kesehatan<br/>
            <span class="text-teal-300 font-semibold">Team Synergy &amp; Evaluation</span>
          </div>
        </div>
      </div>

      <!-- Tombol Kanan -->
      <div class="flex items-center gap-2 shrink-0">
        <button id="soundToggleBtn" onclick="toggleSound()" title="Suara Efek" class="p-2.5 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 transition">
          <i id="soundIcon" data-lucide="volume-2" class="w-4 h-4"></i>
        </button>
        <button onclick="openAdminModal()" class="flex items-center gap-1.5 px-3.5 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold shadow-sm transition">
          <i data-lucide="shield-check" class="w-4 h-4 text-teal-400"></i>
          <span>Dashboard Admin</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main App Container -->
  <main id="app" class="max-w-4xl mx-auto px-4 py-8"></main>

  <!-- Admin Login & Dashboard Modal -->
  <div id="adminModal" class="fixed inset-0 z-50 hidden bg-slate-900/65 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4">
    <div class="bg-white rounded-2xl max-w-5xl w-full max-h-[92vh] overflow-hidden shadow-2xl flex flex-col">
      <div class="px-6 py-4 bg-slate-900 text-white flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <i data-lucide="bar-chart-3" class="w-5 h-5 text-teal-400"></i>
          <div>
            <h2 class="font-bold text-base leading-tight">Dashboard Admin — Rekapitulasi Seluruh Peserta</h2>
            <p class="text-[11px] text-slate-400">Rekap lengkap per tim, peran pemain tiap ronde, dan detail seluruh pertanyaan</p>
          </div>
        </div>
        <button onclick="closeAdminModal()" class="p-1.5 rounded-lg hover:bg-slate-800 text-slate-300 hover:text-white transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div id="adminModalBody" class="p-5 sm:p-6 overflow-y-auto flex-1"></div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. AUDIO ENGINE (WEB AUDIO API)
    // ==========================================
    let soundEnabled = true;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(freq, type = 'sine', duration = 0.15, vol = 0.12) {
      if (!soundEnabled) return;
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playSuccess() {
      playTone(523.25, 'triangle', 0.12, 0.15);
      setTimeout(() => playTone(659.25, 'triangle', 0.15, 0.15), 90);
      setTimeout(() => playTone(783.99, 'triangle', 0.25, 0.15), 180);
    }

    function playError() {
      playTone(220, 'sawtooth', 0.18, 0.12);
      setTimeout(() => playTone(180, 'sawtooth', 0.25, 0.12), 130);
    }

    function playTick(urgent = false) {
      playTone(urgent ? 880 : 600, 'sine', 0.06, urgent ? 0.14 : 0.06);
    }

    function playFanfare() {
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((n, i) => {
        setTimeout(() => playTone(n, 'triangle', 0.3, 0.16), i * 120);
      });
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const icon = document.getElementById('soundIcon');
      icon.setAttribute('data-lucide', soundEnabled ? 'volume-2' : 'volume-x');
      lucide.createIcons();
    }

    // ==========================================
    // 2. BANK SOAL & DATA GAME YANKES BADUNG
    // ==========================================
    const ROUND1_QUESTIONS = [
      {
        q: "Kalau rapat evaluasi pelayanan mendadak molor lewat jam makan siang, menu penyelamat paling kompak tim kita adalah...",
        options: ["Nasi Jinggo / Nasi Campur Bali", "Ayam Geprek / Lalapan", "Bakso / Mie Ayam", "Kopi Susu & Gorengan Dulu"]
      },
      {
        q: "Saat berkas pengajuan perizinan klinik masuk menumpuk di akhir bulan, reaksi pertama tim Yankes biasanya...",
        options: ["Langsung bagi tugas cek kelengkapan", "Tarik napas sambil seduh kopi/teh", "Cek sistem SIPERKLIN & OSS bareng", "Koordinasi jadwal visitasi lapangan"]
      },
      {
        q: "Aplikasi atau alat kerja yang paling wajib terbuka pertama kali di layar komputer/HP pagi hari...",
        options: ["WhatsApp Web / Grup Koordinasi", "Portal SIPERKLIN / OSS", "Spreadsheet / Laporan Kegiatan", "Email Dinas & E-Surat"]
      },
      {
        q: "Kalau ada jadwal visitasi lapangan ke wilayah Badung Selatan (Kuta/Nusa Dua) di jam macet, strategi tim adalah...",
        options: ["Berangkat lebih pagi bareng 1 mobil", "Lewat Tol Bali Mandara biar sat-set", "Mampir sarapan/ngopi dekat lokasi dulu", "Siapkan checklist berkas di jalan"]
      },
      {
        q: "Kata penyemangat andalan saat tim sedang kejar target akreditasi atau laporan triwulan...",
        options: ["Astungkara astiti bhakti, pasti kelar!", "Gas pol, jangan kasih kendor!", "Kerja bareng biar cepat pulang", "Yang penting data valid & rapi"]
      }
    ];

    const ROUND2_WORDS = [
      { word: "PUSKESMAS", tabu: ["Klinik", "Kecamatan", "Dokter", "Berobat", "Kesehatan"] },
      { word: "AKREDITASI", tabu: ["Nilai", "Paripurna", "Survei", "Standar", "Mutu"] },
      { word: "RUJUKAN", tabu: ["Rumah Sakit", "Surat", "Pasien", "Pindah", "BPJS"] },
      { word: "SIPERKLIN", tabu: ["Klinik", "Izin", "Online", "Badung", "Rekomendasi"] },
      { word: "VISITASI", tabu: ["Lapangan", "Cek", "Kunjungan", "Tim", "Lokasi"] },
      { word: "MANGUSADA", tabu: ["RSD", "Kapal", "Rumah Sakit", "Badung", "Pemerintah"] },
      { word: "REKAM MEDIS", tabu: ["Pasien", "Catatan", "Riwayat", "Elektronik", "Dokter"] },
      { word: "APOTEK", tabu: ["Obat", "Resep", "Farmasi", "Beli", "Apoteker"] },
      { word: "AMBULANS", tabu: ["Mobil", "Sirine", "Darurat", "Pasien", "Sirene"] },
      { word: "LABORATORIUM", tabu: ["Darah", "Tes", "Cek", "Sampel", "Hasil"] },
      { word: "SURVEI KEPUASAN", tabu: ["SKM", "Nilai", "Masyarakat", "Kuesioner", "Pelayanan"] },
      { word: "IZIN OPERASIONAL", tabu: ["OSS", "Surat", "Buka", "Klinik", "Resmi"] }
    ];

    const ROUND3_SCENARIOS = [
      {
        title: "Kasus 1: Pemohon Perizinan Bingung Upload Dokumen",
        desc: "Seorang penanggung jawab klinik datang ke loket pelayanan dengan berkas fisik lengkap, namun kesulitan mengunggah 28 dokumen PDF ke sistem online karena ukuran file terlalu besar. Langkah paling kompak & solutif tim?",
        options: [
          { text: "Bantu kompres PDF di tempat & pandu langkah demi langkah di meja layanan", score: 100, tag: "Pelayanan Prima & Solutif" },
          { text: "Berikan brosur panduan lalu minta pemohon mencoba lagi dari rumah", score: 40, tag: "Kurang Responsif" },
          { text: "Terima berkas fisiknya saja tanpa input ke sistem", score: 20, tag: "Melanggar Prosedur Digital" }
        ]
      },
      {
        title: "Kasus 2: Jadwal Visitasi Lapangan Bentrok dengan Rapat Mendadak",
        desc: "30 menit sebelum tim berangkat visitasi ke fasyankes di Mengwi, ada undangan rapat koordinasi mendadak di kantor Dinas. Bagaimana pembagian peran tim?",
        options: [
          { text: "Bagi tim menjadi dua: sebagian tetap visitasi sesuai janji pemohon, sebagian hadiri rapat", score: 100, tag: "Delegasi & Komitmen Tinggi" },
          { text: "Batalkan visitasi sepihak saat tim sudah di jalan", score: 30, tag: "Mengecewakan Pemohon" },
          { text: "Semua ikut rapat dan menunda visitasi hingga bulan depan", score: 20, tag: "Menghambat SLA Layanan" }
        ]
      },
      {
        title: "Kasus 3: Laporan Insiden Keselamatan Pasien dari Fasyankes",
        desc: "Diterima laporan kendala pelayanan darurat di salah satu fasilitas kesehatan wilayah Badung pada sore hari. Sikap tim Yankes?",
        options: [
          { text: "Segera verifikasi fakta lapangan, koordinasi pimpinan, & kawal tindak lanjut perbaikan", score: 100, tag: "Sigap & Akuntabel" },
          { text: "Tunggu laporan resmi tertulis minggu depan baru dibahas", score: 40, tag: "Terlalu Lambat" },
          { text: "Abaikan karena sudah mendekati jam pulang kantor", score: 10, tag: "Tidak Profesional" }
        ]
      }
    ];

    // ==========================================
    // 3. STATE MANAGEMENT & LOCAL STORAGE
    // ==========================================
    const STORAGE_KEY = 'yankes_badung_game_history_v4';
    const TEAMS_CONFIG_KEY = 'yankes_badung_teams_config_v1';
    const ADMIN_PIN = '1234';

    function createBlankTeam(id, name, members) {
      return {
        id,
        name,
        members,
        score: 0,
        r1Harmony: 0,
        r1Points: 0,
        r1Details: [],
        r2Words: 0,
        r2Points: 0,
        r2Speaker: '-',
        r3Score: 0,
        r3Details: []
      };
    }

    function loadSavedTeams(mode) {
      try {
        const raw = JSON.parse(localStorage.getItem(TEAMS_CONFIG_KEY) || 'null');
        if (raw && raw[mode] && Array.isArray(raw[mode]) && raw[mode].length > 0) {
          return raw[mode].map((t, idx) => createBlankTeam(t.id || idx + 1, t.name, [...t.members]));
        }
      } catch (e) {}
      if (mode === 'single') {
        return [createBlankTeam(1, 'Tim Pelayanan Kesehatan', ['Gus Satya', 'Tugek Anya', 'Ayu Wiandani', 'Made'])];
      }
      return [
        createBlankTeam(1, 'Tim Perizinan & Fasyankes', ['Gus Satya', 'Ayu Wiandani']),
        createBlankTeam(2, 'Tim Mutu & Akreditasi', ['Tugek Anya', 'Made'])
      ];
    }

    function persistTeamsConfig() {
      try {
        const existing = JSON.parse(localStorage.getItem(TEAMS_CONFIG_KEY) || '{}');
        existing[state.mode] = state.teams.map(t => ({
          id: t.id,
          name: t.name,
          members: [...t.members]
        }));
        localStorage.setItem(TEAMS_CONFIG_KEY, JSON.stringify(existing));
      } catch (e) {}
    }

    let state = {
      screen: 'setup', // setup, round1, round2, round3, summary
      mode: 'multi',
      teams: loadSavedTeams('multi'),
      newMemberDrafts: {},
      activeTeamIdx: 0,
      // Round 1 state (5 pertanyaan beruntun per tim)
      r1QIdx: 0,
      r1SelectedMember: null,
      r1Answers: [],
      r1Revealed: false,
      // Round 2 state
      r2SelectedSpeaker: null,
      r2Timer: 60,
      r2Interval: null,
      r2WordIdx: 0,
      r2Running: false,
      r2SessionScore: 0,
      r2CorrectCount: 0,
      // Round 3 state (3 kasus beruntun per tim)
      r3SelectedDecisionMaker: null,
      r3Idx: 0,
      r3Timer: 15,
      r3Interval: null,
      r3SelectedOption: null,
      // Private Result View State
      selectedPrivateTeamIdx: null,
      selectedPrivateMemberName: null,
      // Admin state
      adminLoggedIn: false,
      expandedSessionId: null
    };

    function getHistory() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      } catch (e) {
        return [];
      }
    }

    function saveSessionToHistory() {
      const history = getHistory();
      const totalHarmony = Math.round(
        state.teams.reduce((acc, t) => acc + t.r1Harmony, 0) / state.teams.length
      );
      const record = {
        id: 'SESI-' + Date.now().toString().slice(-6),
        timestamp: new Date().toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }),
        mode: state.mode === 'single' ? '1 Tim Besar' : `${state.teams.length} Tim`,
        avgHarmony: totalHarmony,
        teams: state.teams.map(t => ({
          name: t.name,
          members: [...t.members],
          score: t.score,
          r1Harmony: t.r1Harmony,
          r1Points: t.r1Points,
          r1Details: t.r1Details || [],
          r2Words: t.r2Words,
          r2Points: t.r2Points,
          r2Speaker: t.r2Speaker || '-',
          r3Score: t.r3Score,
          r3Details: t.r3Details || [],
          predicate: getPredicate(t.score).title
        }))
      };
      history.unshift(record);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    }

    function getPredicate(score) {
      if (score >= 600) return { title: "Sangat Kompak & Satu Frekuensi!", badge: "bg-emerald-100 text-emerald-800 border-emerald-200", emoji: "🏆" };
      if (score >= 400) return { title: "Solid & Sinergis", badge: "bg-sky-100 text-sky-800 border-sky-200", emoji: "🤝" };
      return { title: "Perlu Ngopi Bareng Lagi", badge: "bg-amber-100 text-amber-800 border-amber-200", emoji: "☕" };
    }

    function clearTimers() {
      if (state.r2Interval) { clearInterval(state.r2Interval); state.r2Interval = null; }
      if (state.r3Interval) { clearInterval(state.r3Interval); state.r3Interval = null; }
    }

    function goHome() {
      clearTimers();
      state.screen = 'setup';
      state.selectedPrivateTeamIdx = null;
      state.selectedPrivateMemberName = null;
      render();
    }

    // ==========================================
    // 4. SCREEN RENDERERS
    // ==========================================
    function render() {
      const app = document.getElementById('app');
      if (state.screen === 'setup') app.innerHTML = renderSetup();
      else if (state.screen === 'round1') app.innerHTML = renderRound1();
      else if (state.screen === 'round2') app.innerHTML = renderRound2();
      else if (state.screen === 'round3') app.innerHTML = renderRound3();
      else if (state.screen === 'summary') app.innerHTML = renderSummary();
      lucide.createIcons();
    }

    // --- SCREEN 1: SETUP TIM & ANGGOTA ---
    function renderSetup() {
      return `
        <div class="glass-card rounded-3xl p-6 sm:p-8">
          <div class="text-center max-w-2xl mx-auto mb-8">
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-sky-100 text-sky-700 text-xs font-bold mb-3">
              <i data-lucide="user-check" class="w-3.5 h-3.5"></i> Pilih Tim &amp; Nama Pemain Mandiri
            </span>
            <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">
              Uji Kekompakan Tim Yankes
            </h2>
            <p class="text-sm text-slate-600 mt-2">
              Atur tim dan daftar anggotanya di bawah. Setelah pemain mengisi jawaban, permainan langsung berlanjut ke pertanyaan berikutnya hingga seluruh ronde selesai.
            </p>
          </div>

          <!-- Pilih Mode -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
            <button onclick="setMode('multi')" class="p-4 rounded-2xl border-2 text-left transition ${state.mode === 'multi' ? 'border-sky-600 bg-sky-50/70' : 'border-slate-200 bg-white hover:border-slate-300'}">
              <div class="flex items-center justify-between mb-1">
                <span class="font-bold text-slate-900">Mode Antar Tim (2–4 Tim)</span>
                <i data-lucide="users" class="w-5 h-5 text-sky-600"></i>
              </div>
              <p class="text-xs text-slate-500">Setiap tim bermain bergiliran dan anggota memilih namanya sendiri sesuai timnya.</p>
            </button>

            <button onclick="setMode('single')" class="p-4 rounded-2xl border-2 text-left transition ${state.mode === 'single' ? 'border-sky-600 bg-sky-50/70' : 'border-slate-200 bg-white hover:border-slate-300'}">
              <div class="flex items-center justify-between mb-1">
                <span class="font-bold text-slate-900">Mode 1 Tim Besar</span>
                <i data-lucide="shield" class="w-5 h-5 text-teal-600"></i>
              </div>
              <p class="text-xs text-slate-500">Seluruh anggota tergabung dalam 1 tim dan memilih namanya sendiri saat bermain.</p>
            </button>
          </div>

          <!-- Konfigurasi Tim & Daftar Anggota -->
          <div class="space-y-4 mb-8">
            <div class="flex items-center justify-between">
              <h3 class="text-sm font-bold text-slate-700 uppercase tracking-wider">Konfigurasi Tim &amp; Anggota</h3>
              ${state.mode === 'multi' && state.teams.length < 4 ? `
                <button onclick="addTeam()" class="inline-flex items-center gap-1 text-xs font-bold text-sky-600 hover:text-sky-700 bg-sky-50 px-3 py-1.5 rounded-lg border border-sky-200">
                  <i data-lucide="plus" class="w-3.5 h-3.5"></i> Tambah Tim
                </button>
              ` : ''}
            </div>

            <div class="grid grid-cols-1 ${state.mode === 'multi' ? 'md:grid-cols-2' : ''} gap-4">
              ${state.teams.map((t, tIdx) => `
                <div class="p-4 rounded-2xl bg-white border border-slate-200 shadow-sm flex flex-col justify-between">
                  <div>
                    <div class="flex items-center justify-between gap-2 mb-3">
                      <div class="w-full">
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-sky-600 mb-1">Nama Tim ${tIdx + 1}</label>
                        <input type="text" value="${t.name}" onchange="updateTeamName(${tIdx}, this.value)"
                          class="font-bold text-slate-900 bg-slate-50 border border-slate-200 rounded-lg px-3 py-1.5 text-sm w-full focus:outline-none focus:border-sky-500"
                          placeholder="Nama Tim" />
                      </div>
                      ${state.mode === 'multi' && state.teams.length > 2 ? `
                        <button onclick="removeTeam(${tIdx})" title="Hapus Tim" class="p-2 mt-4 text-rose-500 hover:bg-rose-50 rounded-lg shrink-0">
                          <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                      ` : ''}
                    </div>

                    <label class="block text-[11px] font-semibold text-slate-500 mb-2">Anggota Tim (${t.members.length} orang):</label>
                    <div class="flex flex-wrap gap-1.5 mb-3">
                      ${t.members.map((m, mIdx) => `
                        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-sky-50 border border-sky-200 text-xs font-semibold text-sky-900">
                          <span>${m}</span>
                          ${t.members.length > 2 ? `
                            <button onclick="removeMemberFromTeam(${tIdx}, ${mIdx})" class="text-sky-500 hover:text-rose-600">
                              <i data-lucide="x" class="w-3 h-3"></i>
                            </button>
                          ` : ''}
                        </span>
                      `).join('')}
                    </div>
                  </div>

                  <!-- Input Tambah Anggota Satuan -->
                  <div class="flex gap-1.5 pt-2 border-t border-slate-100">
                    <input type="text" id="newMemberInput_${tIdx}"
                      value="${state.newMemberDrafts[tIdx] || ''}"
                      oninput="state.newMemberDrafts[${tIdx}] = this.value"
                      onkeydown="if(event.key==='Enter'){ event.preventDefault(); addMemberToTeam(${tIdx}); }"
                      placeholder="Ketik nama anggota baru..."
                      class="text-xs text-slate-700 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 w-full focus:outline-none focus:border-sky-500" />
                    <button onclick="addMemberToTeam(${tIdx})" class="px-3 py-2 rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold shrink-0">
                      + Tambah
                    </button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <button onclick="startGame()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-sky-600 to-teal-500 hover:from-sky-700 hover:to-teal-600 text-white font-extrabold text-base shadow-lg shadow-sky-500/25 flex items-center justify-center gap-2 transition transform active:scale-[0.99]">
            <i data-lucide="play" class="w-5 h-5 fill-current"></i>
            <span>Mulai Permainan</span>
          </button>
        </div>
      `;
    }

    function setMode(mode) {
      state.mode = mode;
      state.teams = loadSavedTeams(mode);
      state.newMemberDrafts = {};
      render();
    }

    function addTeam() {
      if (state.teams.length >= 4) return;
      const n = state.teams.length + 1;
      state.teams.push(createBlankTeam(Date.now(), `Tim Yankes ${n}`, [`Anggota ${n}A`, `Anggota ${n}B`]));
      persistTeamsConfig();
      render();
    }

    function removeTeam(idx) {
      state.teams.splice(idx, 1);
      persistTeamsConfig();
      render();
    }

    function updateTeamName(idx, val) {
      state.teams[idx].name = val.trim() || `Tim ${idx + 1}`;
      persistTeamsConfig();
    }

    function addMemberToTeam(tIdx) {
      const inputEl = document.getElementById(`newMemberInput_${tIdx}`);
      const rawName = (inputEl ? inputEl.value : state.newMemberDrafts[tIdx] || '').trim();
      if (!rawName) return;
      if (!state.teams[tIdx].members.includes(rawName)) {
        state.teams[tIdx].members.push(rawName);
      }
      state.newMemberDrafts[tIdx] = '';
      persistTeamsConfig();
      render();
    }

    function removeMemberFromTeam(tIdx, mIdx) {
      if (state.teams[tIdx].members.length <= 2) return;
      state.teams[tIdx].members.splice(mIdx, 1);
      persistTeamsConfig();
      render();
    }

    function startGame() {
      initAudio();
      persistTeamsConfig();
      playSuccess();
      state.teams.forEach(t => {
        t.score = 0;
        t.r1Harmony = 0;
        t.r1Points = 0;
        t.r1Details = [];
        t.r2Words = 0;
        t.r2Points = 0;
        t.r2Speaker = '-';
        t.r3Score = 0;
        t.r3Details = [];
      });
      state.activeTeamIdx = 0;
      state.r1QIdx = 0;
      state.r1SelectedMember = null;
      state.r1Answers = [];
      state.r1Revealed = false;
      state.selectedPrivateTeamIdx = null;
      state.selectedPrivateMemberName = null;
      state.screen = 'round1';
      render();
    }

    // ==========================================
    // RONDE 1: SATU FREKUENSI (LANJUT KE PERTANYAAN BERIKUTNYA HINGGA SELESAI)
    // ==========================================
    function selectR1Member(memberName) {
      if (state.r1Answers.some(a => a.member === memberName)) return;
      playTone(540, 'sine', 0.08, 0.1);
      state.r1SelectedMember = memberName;
      render();
    }

    function cancelR1MemberSelection() {
      state.r1SelectedMember = null;
      render();
    }

    function renderRound1() {
      const team = state.teams[state.activeTeamIdx];
      const totalQ = ROUND1_QUESTIONS.length;
      const question = ROUND1_QUESTIONS[state.r1QIdx];
      const answeredMembers = state.r1Answers.map(a => a.member);
      const hasMoreQuestions = state.r1QIdx + 1 < totalQ;
      const hasMoreTeams = state.mode === 'multi' && state.activeTeamIdx + 1 < state.teams.length;

      let harmonyPct = 0;
      let topAnswer = '';
      if (state.r1Revealed) {
        const counts = {};
        state.r1Answers.forEach(a => { counts[a.answer] = (counts[a.answer] || 0) + 1; });
        let maxCount = 0;
        for (const [ans, cnt] of Object.entries(counts)) {
          if (cnt > maxCount) { maxCount = cnt; topAnswer = ans; }
        }
        harmonyPct = Math.round((maxCount / state.r1Answers.length) * 100);
      }

      // Label tombol lanjut yang jelas
      let nextBtnLabel = 'Lanjut ke Ronde 2: Estafet Kata Kunci';
      if (hasMoreQuestions) {
        nextBtnLabel = `Lanjut ke Pertanyaan Berikutnya (${state.r1QIdx + 2} dari ${totalQ})`;
      } else if (hasMoreTeams) {
        nextBtnLabel = `Lanjut ke Giliran ${state.teams[state.activeTeamIdx + 1].name}`;
      }

      return `
        <div class="space-y-4">
          ${renderPrivateScoreBar('Ronde 1: Satu Frekuensi', 'Setiap anggota memilih namanya sendiri sesuai tim, lalu menjawab seluruh pertanyaan secara berurutan.')}

          <div class="glass-card rounded-3xl p-6 sm:p-8">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
              <span class="px-3 py-1 rounded-full bg-sky-100 text-sky-800 text-xs font-bold">
                Tim Bermain: ${team.name}
              </span>
              <span class="text-xs font-bold text-sky-700 bg-sky-50 border border-sky-200 px-3 py-1 rounded-full">
                Pertanyaan ${state.r1QIdx + 1} dari ${totalQ} • ${answeredMembers.length}/${team.members.length} Anggota
              </span>
            </div>

            <h3 class="text-lg sm:text-xl font-extrabold text-slate-900 mb-6 leading-snug">
              "${question.q}"
            </h3>

            ${state.r1Revealed ? `
              <!-- Hasil Pertanyaan Ini & Tombol Lanjut ke Pertanyaan Berikutnya -->
              <div class="p-5 rounded-2xl bg-gradient-to-br from-sky-600 to-teal-600 text-white mb-6 text-center">
                <p class="text-xs uppercase tracking-wider font-bold text-sky-100">Skor Kekompakan Pertanyaan ${state.r1QIdx + 1} — ${team.name}</p>
                <div class="text-4xl sm:text-5xl font-black my-1">${harmonyPct}%</div>
                <p class="text-xs text-sky-100">Jawaban Mayoritas Tim: <strong class="text-white">${topAnswer}</strong> (+${harmonyPct} Poin)</p>
              </div>

              <button onclick="nextR1Step()" class="w-full py-4 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-extrabold text-sm flex items-center justify-center gap-2 shadow-md transition">
                <span>${nextBtnLabel}</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
              </button>

            ` : !state.r1SelectedMember ? `
              <!-- Langkah 1: Pemain memilih namanya sendiri dari anggota tim -->
              <div class="p-5 rounded-2xl bg-sky-50/80 border border-sky-200 mb-2">
                <p class="text-xs font-bold uppercase tracking-wider text-sky-800 mb-1">
                  Pilih Nama Anda (${team.name}):
                </p>
                <p class="text-xs text-slate-600 mb-4">
                  Klik nama Anda sendiri di bawah ini untuk mengisi jawaban rahasia Anda.
                </p>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                  ${team.members.map(member => {
                    const isDone = answeredMembers.includes(member);
                    return `
                      <button ${isDone ? 'disabled' : ''} onclick="selectR1Member('${member.replace(/'/g, "\\'")}')"
                        class="p-3.5 rounded-xl border-2 text-left transition flex items-center justify-between ${
                          isDone
                            ? 'border-emerald-200 bg-emerald-50/70 text-emerald-800 cursor-default'
                            : 'border-slate-200 bg-white hover:border-sky-600 hover:bg-sky-50 text-slate-900 shadow-xs'
                        }">
                        <div class="flex items-center gap-2.5">
                          <div class="w-8 h-8 rounded-lg ${isDone ? 'bg-emerald-500 text-white' : 'bg-sky-100 text-sky-700'} font-bold text-xs flex items-center justify-center">
                            ${member.charAt(0).toUpperCase()}
                          </div>
                          <span class="font-bold text-sm">${member}</span>
                        </div>
                        <span class="text-[11px] font-bold px-2 py-0.5 rounded-md ${
                          isDone ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-600'
                        }">
                          ${isDone ? '✓ Sudah Jawab' : 'Pilih Nama'}
                        </span>
                      </button>
                    `;
                  }).join('')}
                </div>
              </div>

            ` : `
              <!-- Langkah 2: Pemain yang dipilih menjawab secara rahasia -->
              <div class="p-4 rounded-2xl bg-amber-50 border border-amber-200 mb-6 flex items-center justify-between gap-2">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 rounded-full bg-amber-500 text-white font-bold flex items-center justify-center">
                    ${state.r1SelectedMember.charAt(0).toUpperCase()}
                  </div>
                  <div>
                    <p class="text-xs text-amber-800 font-semibold">Menjawab Atas Nama (${team.name}):</p>
                    <p class="text-base font-extrabold text-slate-900">${state.r1SelectedMember}</p>
                  </div>
                </div>
                <button onclick="cancelR1MemberSelection()" class="text-xs font-bold text-amber-800 hover:underline bg-amber-100 px-3 py-1.5 rounded-lg">
                  Ganti Nama
                </button>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                ${question.options.map((opt, i) => `
                  <button onclick="submitR1Answer(${i})" class="p-4 rounded-2xl border-2 border-slate-200 bg-white hover:border-sky-500 hover:bg-sky-50 text-left font-semibold text-sm text-slate-800 transition flex items-center gap-3">
                    <span class="w-7 h-7 rounded-lg bg-slate-100 text-slate-700 font-bold text-xs flex items-center justify-center shrink-0">
                      ${String.fromCharCode(65 + i)}
                    </span>
                    <span>${opt}</span>
                  </button>
                `).join('')}
              </div>
            `}
          </div>
        </div>
      `;
    }

    function submitR1Answer(optIdx) {
      if (!state.r1SelectedMember) return;
      const team = state.teams[state.activeTeamIdx];
      const question = ROUND1_QUESTIONS[state.r1QIdx];
      playTone(620, 'sine', 0.1, 0.12);

      state.r1Answers.push({
        member: state.r1SelectedMember,
        answer: question.options[optIdx]
      });
      state.r1SelectedMember = null;

      if (state.r1Answers.length >= team.members.length) {
        const counts = {};
        state.r1Answers.forEach(a => { counts[a.answer] = (counts[a.answer] || 0) + 1; });
        let maxCount = 0;
        let topAnswer = '';
        for (const [ans, cnt] of Object.entries(counts)) {
          if (cnt > maxCount) { maxCount = cnt; topAnswer = ans; }
        }
        const harmonyPct = Math.round((maxCount / state.r1Answers.length) * 100);

        team.score += harmonyPct;
        team.r1Points += harmonyPct;
        team.r1Details.push({
          question: question.q,
          harmonyPct,
          topAnswer,
          answers: [...state.r1Answers]
        });
        team.r1Harmony = Math.round(
          team.r1Details.reduce((acc, d) => acc + d.harmonyPct, 0) / team.r1Details.length
        );

        state.r1Revealed = true;
        playSuccess();
      }
      render();
    }

    function nextR1Step() {
      state.r1Answers = [];
      state.r1SelectedMember = null;
      state.r1Revealed = false;

      // 1. Jika masih ada pertanyaan berikutnya untuk tim ini, lanjut ke pertanyaan berikutnya
      if (state.r1QIdx + 1 < ROUND1_QUESTIONS.length) {
        state.r1QIdx++;
      } else if (state.mode === 'multi' && state.activeTeamIdx + 1 < state.teams.length) {
        // 2. Jika semua pertanyaan tim ini selesai, pindah ke tim berikutnya mulai dari pertanyaan 1
        state.activeTeamIdx++;
        state.r1QIdx = 0;
      } else {
        // 3. Semua tim selesai Ronde 1 -> masuk ke Ronde 2
        state.activeTeamIdx = 0;
        state.r2SelectedSpeaker = null;
        state.r2Timer = 60;
        state.r2Running = false;
        state.r2SessionScore = 0;
        state.r2CorrectCount = 0;
        state.screen = 'round2';
      }
      render();
    }

    // ==========================================
    // RONDE 2: ESTAFET KATA KUNCI (PEMAIN PILIH NAMANYA SENDIRI SESUAI TIM)
    // ==========================================
    function selectR2Speaker(memberName) {
      playTone(540, 'sine', 0.08, 0.1);
      state.r2SelectedSpeaker = memberName;
      render();
    }

    function renderRound2() {
      const team = state.teams[state.activeTeamIdx];
      const item = ROUND2_WORDS[state.r2WordIdx % ROUND2_WORDS.length];
      const hasMoreTeams = state.activeTeamIdx + 1 < state.teams.length;

      return `
        <div class="space-y-4">
          ${renderPrivateScoreBar('Ronde 2: Estafet Kata Kunci', 'Pilih nama pemandu kata dari anggota tim, lalu jelaskan kata utama dalam 60 detik!')}

          <div class="glass-card rounded-3xl p-6 sm:p-8 text-center">
            <div class="flex items-center justify-between mb-6">
              <span class="px-3 py-1 rounded-full bg-teal-100 text-teal-800 text-xs font-bold">
                Tim Bermain: ${team.name}
              </span>
              <div class="flex items-center gap-2 px-4 py-1.5 rounded-full font-extrabold text-sm ${state.r2Timer <= 10 ? 'bg-rose-100 text-rose-600 animate-pulse-fast' : 'bg-slate-100 text-slate-800'}">
                <i data-lucide="timer" class="w-4 h-4"></i>
                <span>${state.r2Timer} Detik</span>
              </div>
            </div>

            ${!state.r2Running && state.r2Timer === 60 ? `
              <div class="py-4 max-w-lg mx-auto">
                <div class="w-14 h-14 rounded-2xl bg-teal-100 text-teal-600 flex items-center justify-center mx-auto mb-3">
                  <i data-lucide="message-square-quote" class="w-7 h-7"></i>
                </div>
                <h3 class="text-xl font-extrabold text-slate-900 mb-1">Siapa Juru Bicara dari ${team.name}?</h3>
                <p class="text-xs text-slate-600 mb-5">
                  Pilih <strong>nama Anda sendiri</strong> di bawah ini sebagai pemandu kata kunci yang akan melihat layar selama <strong>60 detik</strong>.
                </p>

                <div class="flex flex-wrap justify-center gap-2 mb-6">
                  ${team.members.map(m => `
                    <button onclick="selectR2Speaker('${m.replace(/'/g, "\\'")}')"
                      class="px-4 py-2.5 rounded-xl border-2 text-xs sm:text-sm font-bold transition ${
                        state.r2SelectedSpeaker === m
                          ? 'border-teal-600 bg-teal-600 text-white shadow-md'
                          : 'border-slate-200 bg-white text-slate-700 hover:border-teal-400'
                      }">
                      ${m}
                    </button>
                  `).join('')}
                </div>

                <button ${!state.r2SelectedSpeaker ? 'disabled' : ''} onclick="startR2Timer()"
                  class="px-8 py-3.5 rounded-2xl bg-teal-600 hover:bg-teal-700 disabled:opacity-40 disabled:cursor-not-allowed text-white font-extrabold text-sm shadow-lg shadow-teal-500/25 transition">
                  ${state.r2SelectedSpeaker ? `Mulai Estafet (${state.r2SelectedSpeaker})` : 'Pilih Nama Anda Terlebih Dahulu'}
                </button>
              </div>
            ` : state.r2Timer > 0 ? `
              <div class="max-w-md mx-auto">
                <p class="text-xs font-bold text-teal-700 mb-3">Pemandu Kata: ${state.r2SelectedSpeaker} (${team.name})</p>
                <div class="p-6 rounded-2xl bg-slate-900 text-white shadow-xl mb-5">
                  <p class="text-[11px] uppercase tracking-widest text-teal-400 font-bold mb-1">Kata Utama (Jelaskan!)</p>
                  <div class="text-3xl sm:text-4xl font-black tracking-wide mb-5">${item.word}</div>

                  <div class="border-t border-slate-700 pt-4">
                    <p class="text-[11px] uppercase tracking-wider text-rose-400 font-bold mb-2">Kata Tabu (Dilarang Diucapkan):</p>
                    <div class="flex flex-wrap justify-center gap-1.5">
                      ${item.tabu.map(w => `<span class="px-2.5 py-1 rounded-md bg-rose-500/20 text-rose-200 text-xs font-semibold border border-rose-500/30">${w}</span>`).join('')}
                    </div>
                  </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                  <button onclick="r2Skip()" class="py-3.5 rounded-xl bg-amber-100 hover:bg-amber-200 text-amber-900 font-extrabold text-sm transition">
                    Lewati (-5)
                  </button>
                  <button onclick="r2Correct()" class="py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-sm shadow-md transition">
                    Benar! (+10)
                  </button>
                </div>
                <p class="text-xs font-bold text-slate-500 mt-4">Skor Sesi Anda: ${state.r2SessionScore} Poin (${state.r2CorrectCount} Kata Tertebak)</p>
              </div>
            ` : `
              <div class="py-6">
                <h3 class="text-2xl font-extrabold text-slate-900 mb-1">Waktu Habis!</h3>
                <p class="text-sm text-slate-600 mb-5">${team.name} (Pemandu: <strong>${state.r2SelectedSpeaker}</strong>) berhasil menebak <strong>${state.r2CorrectCount} kata</strong> (+<strong>${Math.max(0, state.r2SessionScore)} poin</strong>).</p>
                <button onclick="nextR2Team()" class="px-8 py-3.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm inline-flex items-center gap-2">
                  <span>${hasMoreTeams ? `Lanjut ke ${state.teams[state.activeTeamIdx + 1].name}` : 'Lanjut ke Ronde 3: Misi Darurat Pelayanan'}</span>
                  <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
              </div>
            `}
          </div>
        </div>
      `;
    }

    function startR2Timer() {
      if (!state.r2SelectedSpeaker) return;
      initAudio();
      state.teams[state.activeTeamIdx].r2Speaker = state.r2SelectedSpeaker;
      state.r2Running = true;
      state.r2Interval = setInterval(() => {
        state.r2Timer--;
        if (state.r2Timer <= 10 && state.r2Timer > 0) playTick(true);
        if (state.r2Timer <= 0) {
          clearTimers();
          state.r2Running = false;
          const finalAdd = Math.max(0, state.r2SessionScore);
          state.teams[state.activeTeamIdx].score += finalAdd;
          state.teams[state.activeTeamIdx].r2Points = finalAdd;
          state.teams[state.activeTeamIdx].r2Words = state.r2CorrectCount;
          playFanfare();
        }
        render();
      }, 1000);
      render();
    }

    function r2Correct() {
      playSuccess();
      state.r2SessionScore += 10;
      state.r2CorrectCount++;
      state.r2WordIdx++;
      render();
    }

    function r2Skip() {
      playError();
      state.r2SessionScore -= 5;
      state.r2WordIdx++;
      render();
    }

    function nextR2Team() {
      if (state.activeTeamIdx + 1 < state.teams.length) {
        state.activeTeamIdx++;
        state.r2SelectedSpeaker = null;
        state.r2Timer = 60;
        state.r2Running = false;
        state.r2SessionScore = 0;
        state.r2CorrectCount = 0;
      } else {
        state.activeTeamIdx = 0;
        state.r3SelectedDecisionMaker = null;
        state.r3Idx = 0;
        state.r3SelectedOption = null;
        state.screen = 'round3';
      }
      render();
    }

    // ==========================================
    // RONDE 3: MISI DARURAT PELAYANAN (LANJUT KE PERTANYAAN BERIKUTNYA HINGGA SELESAI)
    // ==========================================
    function selectR3DecisionMaker(memberName) {
      playTone(540, 'sine', 0.08, 0.1);
      state.r3SelectedDecisionMaker = memberName;
      startR3Timer();
      render();
    }

    function renderRound3() {
      const team = state.teams[state.activeTeamIdx];
      const totalScenarios = ROUND3_SCENARIOS.length;
      const scenario = ROUND3_SCENARIOS[state.r3Idx];
      const hasMoreScenarios = state.r3Idx + 1 < totalScenarios;
      const hasMoreTeams = state.activeTeamIdx + 1 < state.teams.length;

      let nextBtnLabel = 'Selesai & Cek Nilai Saya';
      if (hasMoreScenarios) {
        nextBtnLabel = `Lanjut ke Pertanyaan Berikutnya (Kasus ${state.r3Idx + 2} dari ${totalScenarios})`;
      } else if (hasMoreTeams) {
        nextBtnLabel = `Lanjut ke Giliran ${state.teams[state.activeTeamIdx + 1].name}`;
      }

      return `
        <div class="space-y-4">
          ${renderPrivateScoreBar('Ronde 3: Misi Darurat Pelayanan', 'Pilih nama pengambil keputusan dari anggota tim, lalu selesaikan seluruh studi kasus!')}

          <div class="glass-card rounded-3xl p-6 sm:p-8">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
              <div class="flex items-center gap-2">
                <span class="px-3 py-1 rounded-full bg-indigo-100 text-indigo-800 text-xs font-bold">
                  Tim Bermain: ${team.name}
                </span>
                <span class="text-xs font-bold text-indigo-700 bg-indigo-50 border border-indigo-200 px-2.5 py-1 rounded-full">
                  Pertanyaan ${state.r3Idx + 1} dari ${totalScenarios}
                </span>
              </div>
              ${state.r3SelectedDecisionMaker ? `
                <div class="flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-extrabold ${state.r3Timer <= 5 ? 'bg-rose-100 text-rose-600 animate-pulse-fast' : 'bg-slate-100 text-slate-700'}">
                  <i data-lucide="clock" class="w-3.5 h-3.5"></i>
                  <span>${state.r3Timer} Detik</span>
                </div>
              ` : ''}
            </div>

            ${!state.r3SelectedDecisionMaker ? `
              <div class="py-6 text-center max-w-lg mx-auto">
                <div class="w-14 h-14 rounded-2xl bg-indigo-100 text-indigo-600 flex items-center justify-center mx-auto mb-3">
                  <i data-lucide="user-check" class="w-7 h-7"></i>
                </div>
                <h3 class="text-xl font-extrabold text-slate-900 mb-1">Pilih Nama Anda (${team.name})</h3>
                <p class="text-xs text-slate-600 mb-5">
                  Klik <strong>nama Anda sendiri</strong> dari daftar anggota ${team.name} untuk membuka Pertanyaan ${state.r3Idx + 1} dan memulai hitungan mundur <strong>15 detik</strong>.
                </p>

                <div class="flex flex-wrap justify-center gap-2">
                  ${team.members.map(m => `
                    <button onclick="selectR3DecisionMaker('${m.replace(/'/g, "\\'")}')"
                      class="px-4 py-2.5 rounded-xl border-2 border-slate-200 bg-white hover:border-indigo-600 hover:bg-indigo-50 text-xs sm:text-sm font-bold text-slate-800 transition shadow-xs">
                      ${m}
                    </button>
                  `).join('')}
                </div>
              </div>
            ` : `
              <div class="mb-3">
                <span class="text-xs font-bold text-indigo-700">Perwakilan Penjawab: ${state.r3SelectedDecisionMaker}</span>
              </div>
              <h3 class="text-lg font-extrabold text-slate-900 mb-2">${scenario.title}</h3>
              <p class="text-sm text-slate-600 leading-relaxed mb-6">${scenario.desc}</p>

              <div class="space-y-3">
                ${scenario.options.map((opt, idx) => {
                  const isSelected = state.r3SelectedOption === idx;
                  let btnStyle = 'border-slate-200 bg-white hover:border-indigo-400';
                  if (state.r3SelectedOption !== null) {
                    if (opt.score === 100) btnStyle = 'border-emerald-500 bg-emerald-50 text-emerald-900';
                    else if (isSelected) btnStyle = 'border-amber-500 bg-amber-50 text-amber-900';
                    else btnStyle = 'border-slate-200 bg-slate-50 opacity-60';
                  }
                  return `
                    <button ${state.r3SelectedOption !== null ? 'disabled' : ''} onclick="selectR3Option(${idx})"
                      class="w-full p-4 rounded-2xl border-2 text-left transition flex items-center justify-between gap-3 ${btnStyle}">
                      <span class="text-sm font-semibold">${opt.text}</span>
                      ${state.r3SelectedOption !== null && isSelected ? `
                        <span class="shrink-0 text-xs font-extrabold px-2.5 py-1 rounded-lg bg-white shadow-sm">
                          +${opt.score} Poin Anda
                        </span>
                      ` : ''}
                    </button>
                  `;
                }).join('')}
              </div>

              ${state.r3SelectedOption !== null ? `
                <div class="mt-6 flex justify-end">
                  <button onclick="nextR3Step()" class="w-full sm:w-auto px-6 py-3.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-extrabold text-sm inline-flex items-center justify-center gap-2 shadow-md transition">
                    <span>${nextBtnLabel}</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                  </button>
                </div>
              ` : ''}
            `}
          </div>
        </div>
      `;
    }

    function startR3Timer() {
      clearTimers();
      state.r3Timer = 15;
      state.r3Interval = setInterval(() => {
        state.r3Timer--;
        if (state.r3Timer <= 5 && state.r3Timer > 0) playTick(true);
        if (state.r3Timer <= 0) {
          clearTimers();
          if (state.r3SelectedOption === null) {
            selectR3Option(1);
          }
        }
        render();
      }, 1000);
    }

    function selectR3Option(idx) {
      clearTimers();
      state.r3SelectedOption = idx;
      const scenario = ROUND3_SCENARIOS[state.r3Idx];
      const chosen = scenario.options[idx];
      const team = state.teams[state.activeTeamIdx];
      team.score += chosen.score;
      team.r3Score += chosen.score;
      team.r3Details.push({
        scenarioTitle: scenario.title,
        decisionMaker: state.r3SelectedDecisionMaker || '-',
        choice: `${chosen.tag} (${chosen.text})`,
        score: chosen.score
      });
      if (chosen.score === 100) playSuccess();
      else playError();
      render();
    }

    function nextR3Step() {
      // 1. Jika masih ada studi kasus berikutnya untuk tim ini, lanjut ke pertanyaan berikutnya
      if (state.r3Idx + 1 < ROUND3_SCENARIOS.length) {
        state.r3Idx++;
        state.r3SelectedOption = null;
        state.r3SelectedDecisionMaker = null; // beri kesempatan anggota memilih namanya lagi untuk kasus berikutnya
      } else if (state.activeTeamIdx + 1 < state.teams.length) {
        // 2. Pindah ke tim berikutnya mulai dari kasus 1
        state.activeTeamIdx++;
        state.r3Idx = 0;
        state.r3SelectedOption = null;
        state.r3SelectedDecisionMaker = null;
      } else {
        // 3. Semua tim selesai seluruh pertanyaan -> simpan & tampilkan hasil privat
        saveSessionToHistory();
        state.selectedPrivateTeamIdx = null;
        state.selectedPrivateMemberName = null;
        state.screen = 'summary';
        playFanfare();
        if (typeof confetti === 'function') {
          confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } });
        }
      }
      render();
    }

            `}
          </div>

          <div class="pt-3 border-t border-slate-100 flex justify-between items-center">
            <span class="text-[11px] text-slate-400">Semua riwayat hasil tersimpan otomatis di browser perangkat ini.</span>
            <button onclick="adminLogout()" class="text-xs font-bold text-slate-600 hover:text-slate-900">Keluar Mode Admin</button>
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    function verifyAdminPin() {
      const val = document.getElementById('adminPinInput').value;
      if (val === ADMIN_PIN) {
        state.adminLoggedIn = true;
        playSuccess();
        renderAdminBody();
      } else {
        playError();
        document.getElementById('adminPinError').classList.remove('hidden');
      }
    }

    function adminLogout() {
      state.adminLoggedIn = false;
      renderAdminBody();
    }

    function clearHistory() {
      if (confirm('Hapus seluruh data riwayat kekompakan tim?')) {
        localStorage.removeItem(STORAGE_KEY);
        renderAdminBody();
      }
    }

    function exportHistoryCSV() {
      const history = getHistory();
      if (!history.length) return;
      const rows = [[
        'ID Sesi',
        'Waktu',
        'Mode',
        'Nama Tim',
        'Anggota',
        'R1 Satu Frekuensi (%)',
        'R1 Poin',
        'R2 Pemandu Kata',
        'R2 Estafet Kata',
        'R2 Poin',
        'R3 Ringkasan Keputusan',
        'R3 Poin',
        'Total Skor',
        'Predikat Kekompakan'
      ]];
      history.forEach(h => {
        h.teams.forEach(t => {
          const r3Summary = (t.r3Details || [])
            .map((c, idx) => `K${idx + 1}[${c.decisionMaker}]: ${c.choice}`)
            .join(' | ') || '-';
          rows.push([
            h.id,
            `"${h.timestamp}"`,
            `"${h.mode}"`,
            `"${t.name}"`,
            `"${t.members.join('; ')}"`,
            t.r1Harmony,
            t.r1Points ?? t.r1Harmony,
            `"${t.r2Speaker || '-'}"`,
            t.r2Words,
            t.r2Points ?? (t.r2Words * 10),
            `"${r3Summary.replace(/"/g, '""')}"`,
            t.r3Score,
            t.score,
            `"${t.predicate}"`
          ]);
        });
      });
      const csvContent = "data:text/csv;charset=utf-8," + rows.map(e => e.join(",")).join("\n");
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `rekap_lengkap_kekompakan_yankes_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // Initial render
    render();
  </script>
</body>
</html>
