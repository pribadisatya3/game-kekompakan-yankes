    const SUPABASE_URL = 'https://onhyzivslkftrcudrdtb.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9uaHl6aXZzbGtmdHJjdWRyZHRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ5OTI0OTgsImV4cCI6MjExMDU2ODQ5OH0.VSMsFBhcl4zfBoaNMWlFFPOcZhVF2cdtYTADeIpU5do';

      !SUPABASE_URL.includes('YOUR_PROJECT_ID') &&
      SUPABASE_ANON_KEY !== 'YOUR_SUPABASE_ANON_KEY';

    const supabaseClient = isSupabaseConfigured
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : null;

    let dbConnected = false;

    function updateDbStatusBadge(connected, mobileText = '', desktopText = '') {
      dbConnected = connected;
      const el = document.getElementById('dbStatusBadge');
      if (!el) return;
      if (connected) {
        el.className = 'flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl border border-emerald-200 bg-emerald-50 font-bold text-emerald-800 transition';
        el.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500"></span><span class="sm:hidden">${mobileText || 'Cloud'}</span><span class="hidden sm:inline">${desktopText || 'Supabase Terhubung'}</span>`;
      } else {
        el.className = 'flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl border border-amber-200 bg-amber-50 font-bold text-amber-800 transition';
        el.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-500"></span><span class="sm:hidden">${mobileText || 'Lokal'}</span><span class="hidden sm:inline">${desktopText || 'Mode Lokal (Cek Key)'}</span>`;
      }
    }

    // ==========================================
    // 1. AUDIO ENGINE (WEB AUDIO API)
    // ==========================================
    let soundEnabled = true;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(freq, type = 'sine', duration = 0.15, vol = 0.12) {
      if (!soundEnabled) return;
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playSuccess() {
      playTone(523.25, 'triangle', 0.12, 0.15);
      setTimeout(() => playTone(659.25, 'triangle', 0.15, 0.15), 90);
      setTimeout(() => playTone(783.99, 'triangle', 0.25, 0.15), 180);
    }

    function playError() {
      playTone(220, 'sawtooth', 0.18, 0.12);
      setTimeout(() => playTone(180, 'sawtooth', 0.25, 0.12), 130);
    }

    function playTick(urgent = false) {
      playTone(urgent ? 880 : 600, 'sine', 0.06, urgent ? 0.14 : 0.06);
    }

    function playFanfare() {
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((n, i) => {
        setTimeout(() => playTone(n, 'triangle', 0.3, 0.16), i * 120);
      });
    }

      soundEnabled = !soundEnabled;

    // ==========================================
    // 3. STATE MANAGEMENT & SINKRONISASI CLOUD HP <-> LAPTOP
    // ==========================================
    const STORAGE_KEY = 'yankes_badung_game_history_v6';
    const TEAMS_CONFIG_KEY = 'yankes_badung_teams_config_v1';
    const ADMIN_PIN = '1234';

    function createBlankTeam(id, name, members) {
      return {
        id,
        name,
        members,
        score: 0,
        r1Harmony: 0,
        r1Points: 0,
        r1Details: [],
        r1PlayerSubmissions: {},
        r2Words: 0,
        r2Points: 0,
        r2Speaker: '-',
        r2Completed: false,
        r2PlayerSubmissions: {},
        r3Score: 0,
        r3Details: [],
        r3Completed: false,
        r3PlayerSubmissions: {},
        completedPlayers: {}
      };
    }

    function loadLocalTeams(mode) {
      try {
        const raw = JSON.parse(localStorage.getItem(TEAMS_CONFIG_KEY) || 'null');
        if (raw && raw[mode] && Array.isArray(raw[mode]) && raw[mode].length > 0) {
          return raw[mode].map((t, idx) => createBlankTeam(t.id || idx + 1, t.name, [...t.members]));
        }
      } catch (e) {}
      if (mode === 'single') {
        return [createBlankTeam(1, 'Tim Pelayanan Kesehatan', ['Gus Satya', 'Tugek Anya', 'Ayu Wiandani', 'Made'])];
      }
      return [
        createBlankTeam(1, 'Tim Perizinan & Fasyankes', ['Gus Satya', 'Ayu Wiandani']),
        createBlankTeam(2, 'Tim Mutu & Akreditasi', ['Tugek Anya', 'Made'])
      ];
    }

    // Gabungkan konfigurasi tim terbaru dari Supabase tanpa menghapus progres permainan lokal di HP
    function mergeCloudTeamsPreservingProgress(cloudTeamsData) {
      const existingById = new Map(state.teams.map(t => [String(t.id), t]));
      const existingByName = new Map(state.teams.map(t => [t.name.toLowerCase(), t]));

      state.teams = cloudTeamsData.map((ct, idx) => {
        const prev = existingById.get(String(ct.id)) || existingByName.get(String(ct.name).toLowerCase());
        if (prev) {
          return {
            ...prev,
            id: ct.id || prev.id,
            name: ct.name,
            members: [...ct.members]
          };
        }
        return createBlankTeam(ct.id || idx + 1, ct.name, [...ct.members]);
      });

      if (state.activeTeamIdx >= state.teams.length) state.activeTeamIdx = 0;
      if (state.dashboardCompetingTeamIdx >= state.teams.length) state.dashboardCompetingTeamIdx = 0;
      if (state.selectedPrivateTeamIdx !== null && state.selectedPrivateTeamIdx >= state.teams.length) {
        state.selectedPrivateTeamIdx = 0;
      }

      try {
        const existing = JSON.parse(localStorage.getItem(TEAMS_CONFIG_KEY) || '{}');
        existing[state.mode] = state.teams.map(t => ({ id: t.id, name: t.name, members: [...t.members] }));
        localStorage.setItem(TEAMS_CONFIG_KEY, JSON.stringify(existing));
      } catch (e) {}
    }

    async function syncTeamsFromSupabase(mode = state.mode, showToast = false) {
      if (!supabaseClient) return false;
      try {
        const { data, error } = await supabaseClient
          .from('yankes_game_config')
          .select('teams_data')
          .eq('mode', mode)
          .maybeSingle();

        if (!error) {
          updateDbStatusBadge(true, 'Cloud', 'Supabase Terhubung');
          if (data && Array.isArray(data.teams_data) && data.teams_data.length > 0) {
            mergeCloudTeamsPreservingProgress(data.teams_data);
            if (showToast) {
              state.syncNotice = 'Daftar tim & anggota berhasil disinkronkan dari Cloud!';
              setTimeout(() => {
                state.syncNotice = '';
                if (state.screen === 'setup' || state.screen === 'summary') render();
              }, 3000);
            }
            if (state.screen === 'setup' || state.screen === 'summary' || (state.screen === 'round1' && !state.r1SelectedMember)) {
              render();
            }
            if (state.adminLoggedIn && state.adminTab === 'teams') renderAdminBody();
          }
          return true;
        } else {
          updateDbStatusBadge(false, 'Cek Key', 'Cek API Key / Tabel Supabase');
          return false;
        }
      } catch (e) {
        updateDbStatusBadge(false, 'Offline', 'Offline (Mode Lokal)');
        return false;
      }
    }

    async function manualForceSync() {
      playTone(620, 'sine', 0.08, 0.1);
      updateDbStatusBadge(dbConnected, 'Sync...', 'Menyinkronkan...');
      await syncTeamsFromSupabase(state.mode, true);
      if (state.screen === 'summary') {
        await fetchHistoryFromSupabase();
        render();
      }
    }

    // Berlangganan perubahan realtime dari Supabase agar HP otomatis ter-update saat Admin mengubah tim
    function initSupabaseRealtime() {
      if (!supabaseClient) return;
      try {
        supabaseClient
          .channel('yankes_realtime_sync')
          .on(
            'postgres_changes',
            { event: '*', schema: 'public', table: 'yankes_game_config' },
            (payload) => {
              if (payload.new && payload.new.mode === state.mode && Array.isArray(payload.new.teams_data)) {
                mergeCloudTeamsPreservingProgress(payload.new.teams_data);
                if (state.screen === 'setup' || state.screen === 'summary' || (state.screen === 'round1' && !state.r1SelectedMember)) {
                  render();
                }
                if (state.adminLoggedIn && state.adminTab === 'teams') renderAdminBody();
              }
            }
          )
          .on(
            'postgres_changes',
            { event: 'INSERT', schema: 'public', table: 'yankes_game_sessions' },
            () => {
              if (state.adminLoggedIn && state.adminTab === 'recap') {
                refreshAdminData();
              }
            }
          )
          .subscribe();
      } catch (e) {}
    }

    // Otomatis sinkron saat HP membuka kembali tab browser / bangun dari sleep
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && isSupabaseConfigured) {
        syncTeamsFromSupabase(state.mode, false);
      }
    });

    async function persistTeamsConfig(showFeedback = false) {
      const payload = state.teams.map(t => ({
        id: t.id,
        name: t.name,
        members: [...t.members]
      }));

      try {
        const existing = JSON.parse(localStorage.getItem(TEAMS_CONFIG_KEY) || '{}');
        existing[state.mode] = payload;
        localStorage.setItem(TEAMS_CONFIG_KEY, JSON.stringify(existing));
      } catch (e) {}

      if (supabaseClient) {
        try {
          const { error } = await supabaseClient
            .from('yankes_game_config')
            .upsert({
              mode: state.mode,
              teams_data: payload,
              updated_at: new Date().toISOString()
            }, { onConflict: 'mode' });
          if (!error) {
            updateDbStatusBadge(true, 'Cloud', 'Supabase Terhubung');
            if (showFeedback) {
              state.adminTeamSaveMsg = 'Susunan tim & anggota berhasil disimpan ke Supabase & tersinkron ke semua HP!';
              renderAdminBody();
              setTimeout(() => {
                state.adminTeamSaveMsg = '';
                if (state.adminLoggedIn && state.adminTab === 'teams') renderAdminBody();
              }, 3500);
            }
          }
        } catch (e) {}
      } else if (showFeedback) {
        state.adminTeamSaveMsg = 'Susunan tim & anggota tersimpan di penyimpanan lokal.';
        renderAdminBody();
      }
    }

    function getLocalHistory() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      } catch (e) {
        return [];
      }
    }

    async function fetchHistoryFromSupabase() {
      if (!supabaseClient) return getLocalHistory();
      try {
        const { data, error } = await supabaseClient
          .from('yankes_game_sessions')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;
        updateDbStatusBadge(true, 'Cloud', 'Supabase Terhubung');

        const mapped = (data || []).map(row => ({
          dbId: row.id,
          id: row.session_code,
          timestamp: row.timestamp_label,
          mode: row.mode,
          avgHarmony: row.avg_harmony,
          teams: row.teams_data || []
        }));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(mapped));
        return mapped;
      } catch (err) {
        return getLocalHistory();
      }
    }

    async function saveTeamSessionToDatabase(teamToSave) {
      state.saveStatus = 'saving';
      render();

      const sessionCode = 'TIM-' + Date.now().toString().slice(-6);
      const timestampLabel = new Date().toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' });
      const modeLabel = `${teamToSave.name} (Paralel)`;
      const singleTeamPayload = [{
        name: teamToSave.name,
        members: [...teamToSave.members],
        score: teamToSave.score,
        r1Harmony: teamToSave.r1Harmony,
        r1Points: teamToSave.r1Points,
        r1Details: teamToSave.r1Details || [],
        r2Words: teamToSave.r2Words,
        r2Points: teamToSave.r2Points,
        r2Speaker: teamToSave.r2Speaker || '-',
        r3Score: teamToSave.r3Score,
        r3Details: teamToSave.r3Details || [],
        predicate: getPredicate(teamToSave.score).title
      }];

      const localHistory = getLocalHistory();
      localHistory.unshift({
        id: sessionCode,
        timestamp: timestampLabel,
        mode: modeLabel,
        avgHarmony: teamToSave.r1Harmony,
        teams: singleTeamPayload
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(localHistory));

      if (supabaseClient) {
        try {
          const { error } = await supabaseClient
            .from('yankes_game_sessions')
            .insert({
              session_code: sessionCode,
              timestamp_label: timestampLabel,
              mode: modeLabel,
              avg_harmony: teamToSave.r1Harmony,
              teams_data: singleTeamPayload
            });

          if (error) throw error;
          updateDbStatusBadge(true, 'Cloud', 'Supabase Terhubung');
          state.saveStatus = 'saved';
        } catch (err) {
          state.saveStatus = 'local_only';
        }
      } else {
        state.saveStatus = 'local_only';
      }
      render();
    }

    function getPredicate(score) {
      if (score >= 600) return { title: "Sangat Kompak & Satu Frekuensi!", badge: "bg-emerald-100 text-emerald-800 border-emerald-200", emoji: "🏆" };
      if (score >= 400) return { title: "Solid & Sinergis", badge: "bg-sky-100 text-sky-800 border-sky-200", emoji: "🤝" };
      return { title: "Perlu Ngopi Bareng Lagi", badge: "bg-amber-100 text-amber-800 border-amber-200", emoji: "☕" };
    }

    function clearTimers() {
      if (state.r1Interval) { clearInterval(state.r1Interval); state.r1Interval = null; }
      if (state.r2Interval) { clearInterval(state.r2Interval); state.r2Interval = null; }
      if (state.r3Interval) { clearInterval(state.r3Interval); state.r3Interval = null; }
    }

      clearTimers();
      state.screen = 'setup';
      state.selectedPrivateTeamIdx = null;
      state.selectedPrivateMemberName = null;
      render();
      await syncTeamsFromSupabase(state.mode, false);
    }

    async function openDashboardScreen(preselectTeamIdx = null, preselectMember = null) {
      clearTimers();
      if (preselectTeamIdx !== null && state.teams[preselectTeamIdx]) {
        state.dashboardCompetingTeamIdx = preselectTeamIdx;
        state.selectedPrivateTeamIdx = preselectTeamIdx;
      } else {
        if (!state.teams[state.dashboardCompetingTeamIdx]) {
          state.dashboardCompetingTeamIdx = state.activeTeamIdx || 0;
        }
        if (state.selectedPrivateTeamIdx === null || !state.teams[state.selectedPrivateTeamIdx]) {
          state.selectedPrivateTeamIdx = state.dashboardCompetingTeamIdx;
        }
      }
      if (preselectMember) {
        state.selectedPrivateMemberName = preselectMember;
      }
      state.screen = 'summary';
      render();
      await syncTeamsFromSupabase(state.mode, false);
    }

    function selectDashboardCompetingTeam(teamIdx) {
      if (!state.teams[teamIdx]) return;
      playTone(540, 'sine', 0.08, 0.1);
      state.dashboardCompetingTeamIdx = teamIdx;
      state.activeTeamIdx = teamIdx;
      state.selectedPrivateTeamIdx = teamIdx;
      state.selectedPrivateMemberName = null;
      render();
    }

    function resumeRoundFromDashboard(roundScreen, teamIdx = null, memberName = null) {
      clearTimers();
      initAudio();
      const targetIdx = teamIdx !== null ? teamIdx : state.dashboardCompetingTeamIdx;
      state.activeTeamIdx = state.teams[targetIdx] ? targetIdx : 0;
      state.dashboardCompetingTeamIdx = state.activeTeamIdx;
      if (memberName) {
        state.currentPlayerName = memberName;
      }

      if (roundScreen === 'round1') {
        state.r1SelectedMember = null;
        state.r1PlayerQIdx = 0;
        state.r1TempAnswers = [];
        state.r1LastSelectedOpt = null;
        state.r1PlayerDoneBanner = null;
        if (memberName) {
          selectR1Member(memberName);
          return;
        }
      } else if (roundScreen === 'round2') {
        state.r2SelectedSpeaker = memberName || state.currentPlayerName || null;
        state.r2Timer = ROUND_DURATION_SECONDS;
        state.r2Running = false;
        state.r2SessionScore = 0;
        state.r2CorrectCount = 0;
      } else if (roundScreen === 'round3') {
        state.r3SelectedDecisionMaker = null;
        state.r3Idx = 0;
        state.r3SelectedOption = null;
        state.r3Timer = ROUND_DURATION_SECONDS;
        state.r3TempScore = 0;
        state.r3TempDetails = [];
        const preMember = memberName || state.currentPlayerName;
        if (preMember) {
          selectR3DecisionMaker(preMember);
          return;
        }
      }
      state.screen = roundScreen;
      render();
    }

                  return `
                    <div onclick="selectSetupActiveTeam(${tIdx})"

                        <div class="flex flex-wrap gap-1.5 mb-3">
                          ${t.members.map(m => `
                            <span class="inline-flex items-center gap-1.5 pl-1.5 pr-2 py-1 rounded-xl border text-xs font-bold ${accent.chipBg}">
                              <span class="w-4 h-4 rounded-md ${accent.avatarBg} font-extrabold flex items-center justify-center flex-shrink-0" style="font-size: 9px;">
                                ${m.charAt(0).toUpperCase()}
                              </span>
                              <span>${m}</span>

                          oninput="state.newMemberDrafts[${tIdx}] = this.value"

                          placeholder="Tambah nama ke Tim ${tIdx + 1}..."

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
              <button onclick="startGameForTeam(${selectedTeamIdx})" class="sm:col-span-2 py-3.5 sm:py-4 rounded-2xl start-btn-gradient text-white font-extrabold text-sm sm:text-base flex items-center justify-center gap-2 cursor-pointer px-3">
                <i data-lucide="rocket" class="w-5 h-5 flex-shrink-0"></i>
                <span class="truncate">Mulai: ${selectedTeam.name} (Tim ${selectedTeamIdx + 1})</span>
              </button>

              <button onclick="openDashboardScreen(${selectedTeamIdx})" class="py-3.5 sm:py-4 rounded-2xl border-2 border-slate-900 bg-white hover:bg-slate-50 text-slate-900 font-extrabold text-xs sm:text-sm flex items-center justify-center gap-2 cursor-pointer transition">
                <i data-lucide="layout-dashboard" class="w-4 h-4 text-sky-600"></i>
                <span>Menu Dashboard</span>
              </button>
            </div>
          </div>
        </div>
      `;
    }

    async function setMode(mode) {
      state.mode = mode;
      state.teams = loadLocalTeams(mode);
      state.newMemberDrafts = {};
      state.activeTeamIdx = 0;
      state.dashboardCompetingTeamIdx = 0;
      state.selectedPrivateTeamIdx = 0;
      state.selectedPrivateMemberName = null;
      render();
      await syncTeamsFromSupabase(mode, false);
    }

    function addTeam(customName = '') {
      if (state.teams.length >= 4) return;
      const n = state.teams.length + 1;
      const teamTitle = customName.trim() || `Tim Yankes ${n}`;
      state.teams.push(createBlankTeam(Date.now(), teamTitle, [`Anggota ${n}A`, `Anggota ${n}B`]));
      persistTeamsConfig(true);
      render();
      if (state.adminLoggedIn) renderAdminBody();
    }

    function removeTeam(idx) {
      if (state.teams.length <= 1) return;
      state.teams.splice(idx, 1);
      if (state.activeTeamIdx >= state.teams.length) state.activeTeamIdx = 0;
      if (state.dashboardCompetingTeamIdx >= state.teams.length) state.dashboardCompetingTeamIdx = 0;
      persistTeamsConfig(true);
      render();
      if (state.adminLoggedIn) renderAdminBody();
    }

    function updateTeamName(idx, val) {
      state.teams[idx].name = val.trim() || `Tim ${idx + 1}`;
      persistTeamsConfig(true);
      render();
    }

    function addMemberToTeam(tIdx, fromAdmin = false) {
      const inputId = fromAdmin ? `adminNewMemberInput_${tIdx}` : `newMemberInput_${tIdx}`;
      const draftObj = fromAdmin ? state.adminMemberDrafts : state.newMemberDrafts;
      const inputEl = document.getElementById(inputId);
      const rawName = (inputEl ? inputEl.value : draftObj[tIdx] || '').trim();
      if (!rawName) return;
      if (!state.teams[tIdx].members.includes(rawName)) {
        state.teams[tIdx].members.push(rawName);
      }
      draftObj[tIdx] = '';
      persistTeamsConfig(fromAdmin);
      render();
      if (state.adminLoggedIn) renderAdminBody();
    }

    function removeMemberFromTeam(tIdx, mIdx, fromAdmin = false) {
      if (state.teams[tIdx].members.length <= 1) return;
      state.teams[tIdx].members.splice(mIdx, 1);
      persistTeamsConfig(fromAdmin);
      render();
      if (state.adminLoggedIn) renderAdminBody();
    }

    function startGameForTeam(teamIdx = 0) {
      initAudio();
      persistTeamsConfig();
      playSuccess();
      const targetIdx = state.teams[teamIdx] ? teamIdx : 0;
      const targetTeam = state.teams[targetIdx];

      targetTeam.score = 0;
      targetTeam.r1Harmony = 0;
      targetTeam.r1Points = 0;
      targetTeam.r1Details = [];
      targetTeam.r1PlayerSubmissions = {};
      targetTeam.r2Words = 0;
      targetTeam.r2Points = 0;
      targetTeam.r2Speaker = '-';
      targetTeam.r2Completed = false;
      targetTeam.r2PlayerSubmissions = {};
      targetTeam.r3Score = 0;
      targetTeam.r3Details = [];
      targetTeam.r3Completed = false;
      targetTeam.r3PlayerSubmissions = {};
      targetTeam.completedPlayers = {};

      state.activeTeamIdx = targetIdx;
      state.dashboardCompetingTeamIdx = targetIdx;
      state.currentPlayerName = null;
      state.r1SelectedMember = null;
      state.r1PlayerQIdx = 0;
      state.r1TempAnswers = [];
      state.r1LastSelectedOpt = null;
      state.r1PlayerDoneBanner = null;
      state.r1Timer = ROUND_DURATION_SECONDS;
      state.selectedPrivateTeamIdx = targetIdx;
      state.selectedPrivateMemberName = null;
      state.sessionSavedOnce = false;
      state.saveStatus = 'idle';
      state.screen = 'round1';
      render();
    }

    // ==========================================
    // RONDE 1: SATU FREKUENSI (30 DETIK / PERTANYAAN)
    // ==========================================
    function startR1QuestionTimer() {
      clearTimers();
      state.r1Timer = ROUND_DURATION_SECONDS;
      state.r1Interval = setInterval(() => {
        state.r1Timer--;
        if (state.r1Timer <= 5 && state.r1Timer > 0) playTick(true);
        if (state.r1Timer <= 0) {
          clearTimers();
          if (state.r1LastSelectedOpt === null) {
            state.r1LastSelectedOpt = 0;
          }
          advanceR1PlayerQuestion(true);
          return;
        }
        render();
      }, 1000);
    }

    function selectR1Member(memberName) {
      playTone(540, 'sine', 0.08, 0.1);
      state.currentPlayerName = memberName;
      state.r1SelectedMember = memberName;
      state.r1PlayerQIdx = 0;
      state.r1TempAnswers = [];
      state.r1LastSelectedOpt = null;
      state.r1PlayerDoneBanner = null;
      startR1QuestionTimer();
      render();
    }

    function cancelR1MemberSelection() {
      clearTimers();
      state.r1SelectedMember = null;
      state.r1PlayerQIdx = 0;
      state.r1TempAnswers = [];
      state.r1LastSelectedOpt = null;
      render();
    }

    function chooseR1Option(optIdx) {
      playTone(620, 'sine', 0.09, 0.12);
      state.r1LastSelectedOpt = optIdx;
      render();
    }

    function advanceR1PlayerQuestion(isAutoTimeout = false) {
      if (state.r1LastSelectedOpt === null || !state.r1SelectedMember) return;
      clearTimers();
      const team = state.teams[state.activeTeamIdx];
      const question = ROUND1_QUESTIONS[state.r1PlayerQIdx];
      const chosenText = question.options[state.r1LastSelectedOpt];

      state.r1TempAnswers[state.r1PlayerQIdx] = chosenText;
      state.r1LastSelectedOpt = null;

      if (state.r1PlayerQIdx + 1 < ROUND1_QUESTIONS.length) {
        if (!isAutoTimeout) playTone(680, 'triangle', 0.1, 0.12);
        else playError();
        state.r1PlayerQIdx++;
        startR1QuestionTimer();
        render();
        return;
      }

      const finishedPlayer = state.r1SelectedMember;
      team.r1PlayerSubmissions[finishedPlayer] = [...state.r1TempAnswers];
      recalculateTeamRound1(team);

      state.currentPlayerName = finishedPlayer;
      state.r1SelectedMember = null;
      state.r1PlayerQIdx = 0;
      state.r1TempAnswers = [];
      state.r1PlayerDoneBanner = finishedPlayer;

      // Langsung lanjut ke Ronde 2 untuk nama ini
      state.r2SelectedSpeaker = finishedPlayer;
      state.r2Timer = ROUND_DURATION_SECONDS;
      state.r2Running = false;
      state.r2SessionScore = 0;
      state.r2CorrectCount = 0;

      playSuccess();
      state.screen = 'round2';
      render();
    }

    function recalculateTeamRound1(team) {
      const submittedMembers = team.members.filter(m => Boolean(team.r1PlayerSubmissions[m]));
      if (submittedMembers.length === 0) return;

      team.score -= team.r1Points;
      team.r1Details = [];
      let totalPoints = 0;

      ROUND1_QUESTIONS.forEach((qObj, qIdx) => {
        const answersForQ = submittedMembers.map(m => ({
          member: m,
          answer: team.r1PlayerSubmissions[m][qIdx]
        }));
        const counts = {};
        answersForQ.forEach(a => { counts[a.answer] = (counts[a.answer] || 0) + 1; });
        let maxCount = 0;
        let topAnswer = '';
        for (const [ans, cnt] of Object.entries(counts)) {
          if (cnt > maxCount) { maxCount = cnt; topAnswer = ans; }
        }
        const harmonyPct = Math.round((maxCount / answersForQ.length) * 100);
        totalPoints += harmonyPct;
        team.r1Details.push({
          question: qObj.q,
          harmonyPct,
          topAnswer,
          answers: answersForQ
        });
      });

      team.r1Points = totalPoints;
      team.score += totalPoints;
      team.r1Harmony = Math.round(totalPoints / ROUND1_QUESTIONS.length);
    }

    function renderRound1() {
      const team = state.teams[state.activeTeamIdx];
      const totalQ = ROUND1_QUESTIONS.length;
      const completedMembers = team.members.filter(m => Boolean(team.completedPlayers[m]));

      if (!state.r1SelectedMember) {
        return `
          <div class="space-y-4">
            ${renderPrivateScoreBar('Ronde 1: Satu Frekuensi (30 Detik/Soal)', 'Pilih nama Anda, selesaikan Ronde 1 → Ronde 2 → Ronde 3, lalu otomatis ke Menu Dashboard.')}

            <div class="glass-card rounded-3xl p-4 sm:p-8">
              <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
                <span class="px-3 py-1 rounded-full bg-sky-100 text-sky-800 text-xs font-bold">
                  Tim Bermain: ${team.name} (Tim ${state.activeTeamIdx + 1})
                </span>
                <span class="text-xs font-bold text-slate-500">
                  ${completedMembers.length} dari ${team.members.length} Anggota Tuntas 3 Ronde
                </span>
              </div>

              <h3 class="text-base sm:text-xl font-extrabold text-slate-900 mb-1">
                Pilih Nama Anda (${team.name})
              </h3>
              <p class="text-xs text-slate-600 mb-5">
                Klik <strong>nama Anda sendiri</strong> di bawah ini untuk memulai <strong>Ronde 1 → Ronde 2 → Ronde 3</strong> secara berurutan.
              </p>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                ${team.members.map(member => {
                  const isAllDone = Boolean(team.completedPlayers[member]);
                  const isR1Done = Boolean(team.r1PlayerSubmissions[member]);
                  return `
                    <button onclick="${isAllDone ? `openDashboardScreen(${state.activeTeamIdx}, '${member.replace(/'/g, "\\'")}')` : `selectR1Member('${member.replace(/'/g, "\\'")}')`}"
                      class="p-3.5 sm:p-4 rounded-2xl border-2 text-left transition flex items-center justify-between ${
                        isAllDone
                          ? 'border-emerald-200 bg-emerald-50 hover:bg-emerald-100 text-emerald-900'
                          : 'border-slate-200 bg-white hover:border-sky-600 hover:bg-sky-50 text-slate-900 shadow-sm'
                      }">
                      <div class="flex items-center gap-3 min-w-0">
                        <div class="w-9 h-9 rounded-xl ${isAllDone ? 'bg-emerald-600 text-white' : 'bg-sky-100 text-sky-700'} font-bold text-sm flex items-center justify-center flex-shrink-0">
                          ${member.charAt(0).toUpperCase()}
                        </div>
                        <div class="min-w-0">
                          <span class="font-bold text-sm sm:text-base block truncate">${member}</span>
                          <span class="${isAllDone ? 'text-emerald-700' : 'text-slate-400'} font-semibold block truncate" style="font-size: 10px;">
                            ${isAllDone ? 'Selesai 3 Ronde • Lihat Dashboard' : isR1Done ? 'Ulangi dari Ronde 1' : 'Ronde 1 → Ronde 2 → Ronde 3'}
                          </span>
                        </div>
                      </div>
                      <span class="font-bold px-2.5 py-1 rounded-lg flex-shrink-0 ${
                        isAllDone ? 'bg-emerald-600 text-white' : 'bg-sky-600 text-white'
                      }" style="font-size: 11px;">
                        ${isAllDone ? 'Dashboard →' : 'Mulai →'}
                      </span>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>
          </div>
        `;
      }

      const question = ROUND1_QUESTIONS[state.r1PlayerQIdx];
      const hasNextQ = state.r1PlayerQIdx + 1 < totalQ;
      const progressPct = Math.round(((state.r1PlayerQIdx + 1) / totalQ) * 100);

      return `
        <div class="space-y-4">
          ${renderPrivateScoreBar('Ronde 1 dari 3: Satu Frekuensi', 'Setelah selesai 5 pertanyaan, otomatis lanjut ke Ronde 2.')}

          <div class="glass-card rounded-3xl p-4 sm:p-8">
            <div class="p-3 sm:p-3.5 rounded-2xl bg-amber-50 border border-amber-200 mb-4 flex items-center justify-between gap-2">
              <div class="flex items-center gap-2.5 min-w-0">
                <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-amber-500 text-white font-bold flex items-center justify-center flex-shrink-0">
                  ${state.r1SelectedMember.charAt(0).toUpperCase()}
                </div>
                <div class="min-w-0">
                  <p class="text-amber-800 font-semibold truncate" style="font-size: 10px;">Peserta (${team.name}) • Tahap 1/3:</p>
                  <p class="text-xs sm:text-base font-extrabold text-slate-900 truncate">${state.r1SelectedMember}</p>
                </div>
              </div>

              <div class="flex items-center gap-1.5 flex-shrink-0">
                <div class="flex items-center gap-1 px-2.5 py-1.5 rounded-xl font-extrabold text-xs ${state.r1Timer <= 7 ? 'bg-rose-600 text-white animate-pulse-fast' : 'bg-slate-900 text-teal-300'}">
                  <i data-lucide="timer" class="w-3.5 h-3.5"></i>
                  <span>${state.r1Timer}d</span>
                </div>
                <button onclick="cancelR1MemberSelection()" class="text-xs font-bold text-amber-800 hover:underline bg-amber-100 px-2 py-1.5 rounded-lg">
                  Ganti
                </button>
              </div>
            </div>

            <div class="mb-5">
              <div class="flex items-center justify-between text-xs font-bold text-sky-800 mb-1.5">
                <span>Pertanyaan ${state.r1PlayerQIdx + 1} dari ${totalQ}</span>
                <span>${progressPct}%</span>
              </div>
              <div class="w-full h-2 bg-slate-200 rounded-full overflow-hidden">
                <div class="h-full bg-sky-600 transition-all" style="width: ${progressPct}%;"></div>
              </div>
            </div>

            <h3 class="text-sm sm:text-xl font-extrabold text-slate-900 mb-4 sm:mb-5 leading-snug">
              "${question.q}"
            </h3>

            <div class="space-y-2.5 mb-5">
              ${question.options.map((opt, i) => {
                const isSelected = state.r1LastSelectedOpt === i;
                return `
                  <button onclick="chooseR1Option(${i})"
                    class="w-full p-3.5 sm:p-4 rounded-2xl border-2 text-left font-semibold text-xs sm:text-sm transition flex items-center justify-between gap-3 ${
                      isSelected
                        ? 'border-sky-600 bg-sky-50 text-sky-900 shadow-sm'
                        : 'border-slate-200 bg-white hover:border-sky-400 text-slate-800'
                    }">
                    <div class="flex items-center gap-2.5 sm:gap-3">
                      <span class="w-6 h-6 sm:w-7 sm:h-7 rounded-lg font-bold text-xs flex items-center justify-center flex-shrink-0 ${
                        isSelected ? 'bg-sky-600 text-white' : 'bg-slate-100 text-slate-700'
                      }">
                        ${String.fromCharCode(65 + i)}
                      </span>
                      <span>${opt}</span>
                    </div>
                    ${isSelected ? `<i data-lucide="check-circle-2" class="w-5 h-5 text-sky-600 flex-shrink-0"></i>` : ''}
                  </button>
                `;
              }).join('')}
            </div>

            <button ${state.r1LastSelectedOpt === null ? 'disabled' : ''} onclick="advanceR1PlayerQuestion(false)"

              style="${state.r1LastSelectedOpt === null ? 'opacity:0.4; cursor:not-allowed;' : ''}">

                ${state.r1LastSelectedOpt === null
                  ? 'Pilih Jawaban Terlebih Dahulu'
