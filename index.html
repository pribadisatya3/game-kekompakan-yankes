                    : `Selesai Ronde 1 & Lanjut Ronde 2`}
              </span>
              <i data-lucide="arrow-right" class="w-4 h-4 flex-shrink-0"></i>
            </button>
          </div>
        </div>
      `;
    }

    // ==========================================
    // RONDE 2: ESTAFET KATA KUNCI (30 DETIK)
    // ==========================================
    function selectR2Speaker(memberName) {
      playTone(540, 'sine', 0.08, 0.1);
      state.r2SelectedSpeaker = memberName;
      state.currentPlayerName = memberName;
      render();
    }

    function renderRound2() {
      const team = state.teams[state.activeTeamIdx];
      const item = ROUND2_WORDS[state.r2WordIdx % ROUND2_WORDS.length];
      const activePlayer = state.r2SelectedSpeaker || state.currentPlayerName;

      return `
        <div class="space-y-4">
          ${renderPrivateScoreBar('Ronde 2 dari 3: Estafet Kata Kunci (30 Detik)', 'Jelaskan kata utama selama 30 detik, lalu lanjut ke Ronde 3!')}

          <div class="glass-card rounded-3xl p-4 sm:p-8 text-center">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-5">
              <div class="flex flex-wrap items-center gap-1.5">
                <span class="px-2.5 py-1 rounded-full bg-teal-100 text-teal-800 text-xs font-bold">
                  ${team.name} • 2/3
                </span>
                ${activePlayer ? `
                  <span class="px-2.5 py-1 rounded-full bg-amber-100 text-amber-900 text-xs font-bold">
                    ${activePlayer}
                  </span>
                ` : ''}
              </div>
              <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full font-extrabold text-xs sm:text-sm ${state.r2Timer <= 7 ? 'bg-rose-600 text-white animate-pulse-fast' : 'bg-slate-100 text-slate-800'}">
                <i data-lucide="timer" class="w-4 h-4"></i>
                <span>${state.r2Timer} Detik</span>
              </div>
            </div>

            ${!state.r2Running && state.r2Timer === ROUND_DURATION_SECONDS ? `
              <div class="py-3 max-w-lg mx-auto">
                ${state.r1PlayerDoneBanner ? `
                  <div class="p-3 rounded-2xl bg-emerald-50 border border-emerald-200 text-emerald-900 text-xs font-bold mb-4 flex items-center justify-center gap-2">
                    <i data-lucide="check-circle" class="w-4 h-4 text-emerald-600 flex-shrink-0"></i>
                    <span>Ronde 1 (${state.r1PlayerDoneBanner}) selesai! Lanjut ke Ronde 2.</span>
                  </div>
                ` : ''}

                <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-teal-100 text-teal-600 flex items-center justify-center mx-auto mb-3">
                  <i data-lucide="message-square-quote" class="w-6 h-6 sm:w-7 sm:h-7"></i>
                </div>
                <h3 class="text-lg sm:text-xl font-extrabold text-slate-900 mb-1">
                  ${activePlayer ? `Giliran ${activePlayer} — Ronde 2` : `Pilih Nama Anda (${team.name})`}
                </h3>
                <p class="text-xs text-slate-600 mb-5">
                  Jelaskan kata kunci yang muncul di layar selama <strong>30 detik</strong> tanpa menyebut kata tabu.
                </p>

                <div class="flex flex-wrap justify-center gap-2 mb-6">
                  ${team.members.map(m => `
                    <button onclick="selectR2Speaker('${m.replace(/'/g, "\\'")}')"
                      class="px-3.5 py-2 rounded-xl border-2 text-xs sm:text-sm font-bold transition ${
                        state.r2SelectedSpeaker === m
                          ? 'border-teal-600 bg-teal-600 text-white shadow-md'
                          : 'border-slate-200 bg-white text-slate-700 hover:border-teal-400'
                      }">
                      ${m}
                    </button>
                  `).join('')}
                </div>

                <button ${!state.r2SelectedSpeaker ? 'disabled' : ''} onclick="startR2Timer()"
                  class="w-full sm:w-auto px-7 py-3.5 sm:py-4 rounded-2xl bg-teal-600 hover:bg-teal-700 text-white font-extrabold text-xs sm:text-sm shadow-lg transition" style="${!state.r2SelectedSpeaker ? 'opacity:0.45; cursor:not-allowed;' : ''}">
                  ${state.r2SelectedSpeaker ? `Mulai Estafet 30 Detik (${state.r2SelectedSpeaker})` : 'Pilih Nama Anda Terlebih Dahulu'}
                </button>
              </div>
            ` : state.r2Timer > 0 ? `
              <div class="max-w-md mx-auto">
                <p class="text-xs font-bold text-teal-700 mb-3">Pemandu Kata: ${state.r2SelectedSpeaker} (${team.name})</p>
                <div class="p-5 sm:p-6 rounded-2xl bg-slate-900 text-white shadow-xl mb-5">
                  <p class="uppercase tracking-widest text-teal-400 font-bold mb-1" style="font-size: 10px;">Kata Utama (Jelaskan!)</p>
                  <div class="text-2xl sm:text-4xl font-black tracking-wide mb-4 sm:mb-5">${item.word}</div>

                  <div class="border-t border-slate-700 pt-3.5">
                    <p class="uppercase tracking-wider text-rose-400 font-bold mb-2" style="font-size: 10px;">Kata Tabu (Dilarang Diucapkan):</p>
                    <div class="flex flex-wrap justify-center gap-1.5">
                      ${item.tabu.map(w => `<span class="px-2 py-0.5 sm:px-2.5 sm:py-1 rounded-md text-rose-200 text-xs font-semibold border border-rose-400" style="background: rgba(244,63,94,0.2);">${w}</span>`).join('')}
                    </div>
                  </div>
                </div>

                <div class="grid grid-cols-2 gap-2.5 sm:gap-3">
                  <button onclick="r2Skip()" class="py-3.5 sm:py-4 rounded-2xl bg-amber-100 hover:bg-amber-200 text-amber-900 font-extrabold text-xs sm:text-sm transition">
                    Lewati (-5)
                  </button>
                  <button onclick="r2Correct()" class="py-3.5 sm:py-4 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs sm:text-sm shadow-md transition">
                    Benar! (+10)
                  </button>
                </div>
                <p class="text-xs font-bold text-slate-500 mt-4">Skor Sesi Anda: ${state.r2SessionScore} Poin (${state.r2CorrectCount} Kata Tertebak)</p>
              </div>
            ` : `
              <div class="py-5">
                <div class="w-14 h-14 rounded-2xl bg-emerald-100 text-emerald-700 flex items-center justify-center mx-auto mb-3">
                  <i data-lucide="check-circle-2" class="w-8 h-8"></i>
                </div>
                <h3 class="text-xl sm:text-2xl font-extrabold text-slate-900 mb-1">Ronde 2 Selesai!</h3>
                <p class="text-xs sm:text-sm text-slate-600 mb-6">
                  <strong>${state.r2SelectedSpeaker}</strong> (${team.name}) berhasil menebak <strong>${state.r2CorrectCount} kata</strong> (+<strong>${Math.max(0, state.r2SessionScore)} poin</strong>).
                </p>

                <div class="max-w-md mx-auto">
                  <button onclick="proceedToRound3ForPlayer()" class="w-full py-3.5 sm:py-4 rounded-2xl start-btn-gradient text-white font-extrabold text-xs sm:text-base inline-flex items-center justify-center gap-2 shadow-lg px-3">
                    <span class="truncate">Lanjut ke Ronde 3: Misi Darurat</span>
                    <i data-lucide="arrow-right" class="w-5 h-5 flex-shrink-0"></i>
                  </button>
                </div>
              </div>
            `}
          </div>
        </div>
      `;
    }

    function startR2Timer() {
      if (!state.r2SelectedSpeaker) return;
      initAudio();
      state.teams[state.activeTeamIdx].r2Speaker = state.r2SelectedSpeaker;
      state.r2Running = true;
      state.r2Interval = setInterval(() => {
        state.r2Timer--;
        if (state.r2Timer <= 7 && state.r2Timer > 0) playTick(true);
        if (state.r2Timer <= 0) {
          clearTimers();
          state.r2Running = false;
          const finalAdd = Math.max(0, state.r2SessionScore);
          const team = state.teams[state.activeTeamIdx];
          const speaker = state.r2SelectedSpeaker;

          const prevPlayerPts = (team.r2PlayerSubmissions[speaker] && team.r2PlayerSubmissions[speaker].points) || 0;
          const prevPlayerWords = (team.r2PlayerSubmissions[speaker] && team.r2PlayerSubmissions[speaker].words) || 0;

          team.r2PlayerSubmissions[speaker] = {
            words: state.r2CorrectCount,
            points: finalAdd
          };

          team.score = team.score - prevPlayerPts + finalAdd;
          team.r2Points = team.r2Points - prevPlayerPts + finalAdd;
          team.r2Words = team.r2Words - prevPlayerWords + state.r2CorrectCount;
          team.r2Completed = true;
          playFanfare();
        }
        render();
      }, 1000);
      render();
    }

    function r2Correct() {
      playSuccess();
      state.r2SessionScore += 10;
      state.r2CorrectCount++;
      state.r2WordIdx++;
      render();
    }

    function r2Skip() {
      playError();
      state.r2SessionScore -= 5;
      state.r2WordIdx++;
      render();
    }

    function proceedToRound3ForPlayer() {
      clearTimers();
      const player = state.r2SelectedSpeaker || state.currentPlayerName;
      state.currentPlayerName = player;
      state.r3SelectedDecisionMaker = null;
      state.r3Idx = 0;
      state.r3SelectedOption = null;
      state.r3Timer = ROUND_DURATION_SECONDS;
      state.r3TempScore = 0;
      state.r3TempDetails = [];

      if (player) {
        selectR3DecisionMaker(player);
      } else {
        state.screen = 'round3';
        render();
      }
    }

    // ==========================================
    // RONDE 3: MISI DARURAT PELAYANAN (30 DETIK / KASUS)
    // ==========================================
    function selectR3DecisionMaker(memberName) {
      playTone(540, 'sine', 0.08, 0.1);
      state.currentPlayerName = memberName;
      state.r3SelectedDecisionMaker = memberName;
      state.r3Idx = 0;
      state.r3SelectedOption = null;
      state.r3TempScore = 0;
      state.r3TempDetails = [];
      state.screen = 'round3';
      startR3Timer();
      render();
    }

    function renderRound3() {
      const team = state.teams[state.activeTeamIdx];
      const totalScenarios = ROUND3_SCENARIOS.length;
      const scenario = ROUND3_SCENARIOS[state.r3Idx];
      const hasMoreScenarios = state.r3Idx + 1 < totalScenarios;

      const nextBtnLabel = hasMoreScenarios
        ? `Kasus Berikutnya (${state.r3Idx + 2}/${totalScenarios})`
        : `Selesai & Buka Menu Dashboard`;

      return `
        <div class="space-y-4">
          ${renderPrivateScoreBar('Ronde 3 dari 3: Misi Darurat (30 Detik/Kasus)', 'Selesaikan 3 studi kasus, lalu otomatis diarahkan ke Menu Dashboard.')}

          <div class="glass-card rounded-3xl p-4 sm:p-8">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
              <div class="flex items-center gap-1.5">
                <span class="px-2.5 py-1 rounded-full bg-indigo-100 text-indigo-800 text-xs font-bold">
                  ${team.name} • 3/3
                </span>
                <span class="text-xs font-bold text-indigo-700 bg-indigo-50 border border-indigo-200 px-2.5 py-1 rounded-full">
                  Kasus ${state.r3Idx + 1}/${totalScenarios}
                </span>
              </div>
              ${state.r3SelectedDecisionMaker ? `
                <div class="flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-extrabold ${state.r3Timer <= 7 ? 'bg-rose-600 text-white animate-pulse-fast' : 'bg-slate-100 text-slate-700'}">
                  <i data-lucide="clock" class="w-3.5 h-3.5"></i>
                  <span>${state.r3Timer} Detik</span>
                </div>
              ` : ''}
            </div>

            ${!state.r3SelectedDecisionMaker ? `
              <div class="py-5 text-center max-w-lg mx-auto">
                <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-indigo-100 text-indigo-600 flex items-center justify-center mx-auto mb-3">
                  <i data-lucide="user-check" class="w-6 h-6 sm:w-7 sm:h-7"></i>
                </div>
                <h3 class="text-lg sm:text-xl font-extrabold text-slate-900 mb-1">Pilih Nama Anda (${team.name})</h3>
                <p class="text-xs text-slate-600 mb-5">
                  Klik <strong>nama Anda sendiri</strong> dari daftar anggota ${team.name} untuk menjawab <strong>${totalScenarios} studi kasus pelayanan</strong> (waktu <strong>30 detik/kasus</strong>).
                </p>

                <div class="flex flex-wrap justify-center gap-2">
                  ${team.members.map(m => `
                    <button onclick="selectR3DecisionMaker('${m.replace(/'/g, "\\'")}')"
                      class="px-4 py-2.5 rounded-xl border-2 border-slate-200 bg-white hover:border-indigo-600 hover:bg-indigo-50 text-xs sm:text-sm font-bold text-slate-800 transition shadow-sm">
                      ${m}
                    </button>
                  `).join('')}
                </div>
              </div>
            ` : `
              <div class="mb-2.5">
                <span class="text-xs font-bold text-indigo-700">Peserta Aktif: ${state.r3SelectedDecisionMaker}</span>
              </div>
              <h3 class="text-sm sm:text-lg font-extrabold text-slate-900 mb-2">${scenario.title}</h3>
              <p class="text-xs sm:text-sm text-slate-600 leading-relaxed mb-4 sm:mb-5">${scenario.desc}</p>

              <div class="space-y-2.5">
                ${scenario.options.map((opt, idx) => {
                  const isSelected = state.r3SelectedOption === idx;
                  let btnStyle = 'border-slate-200 bg-white hover:border-indigo-400';
                  if (state.r3SelectedOption !== null) {
                    if (opt.score === 100) btnStyle = 'border-emerald-500 bg-emerald-50 text-emerald-900';
                    else if (isSelected) btnStyle = 'border-amber-500 bg-amber-50 text-amber-900';
                    else btnStyle = 'border-slate-200 bg-slate-50 opacity-60';
                  }
                  return `
                    <button ${state.r3SelectedOption !== null ? 'disabled' : ''} onclick="selectR3Option(${idx})"
                      class="w-full p-3.5 sm:p-4 rounded-2xl border-2 text-left transition flex items-center justify-between gap-2.5 ${btnStyle}">
                      <span class="text-xs sm:text-sm font-semibold">${opt.text}</span>
                      ${state.r3SelectedOption !== null && isSelected ? `
                        <span class="flex-shrink-0 text-xs font-extrabold px-2 py-1 rounded-lg bg-white shadow-sm">
                          +${opt.score}
                        </span>
                      ` : ''}
                    </button>
                  `;
                }).join('')}
              </div>

              ${state.r3SelectedOption !== null ? `
                <div class="mt-5">
                  <button onclick="nextR3Step()" class="w-full py-3.5 sm:py-4 rounded-2xl ${hasMoreScenarios ? 'bg-slate-900 hover:bg-slate-800' : 'start-btn-gradient'} text-white font-extrabold text-xs sm:text-base flex items-center justify-center gap-2 shadow-lg transition px-3">
                    <span>${nextBtnLabel}</span>
                    <i data-lucide="${hasMoreScenarios ? 'arrow-right' : 'layout-dashboard'}" class="w-4 h-4 sm:w-5 sm:h-5 flex-shrink-0"></i>
                  </button>
                </div>
              ` : ''}
            `}
          </div>
        </div>
      `;
    }

    function startR3Timer() {
      clearTimers();
      state.r3Timer = ROUND_DURATION_SECONDS;
      state.r3Interval = setInterval(() => {
        state.r3Timer--;
        if (state.r3Timer <= 7 && state.r3Timer > 0) playTick(true);
        if (state.r3Timer <= 0) {
          clearTimers();
          if (state.r3SelectedOption === null) {
            selectR3Option(1);
          }
        }
        render();
      }, 1000);
    }

    function selectR3Option(idx) {
      clearTimers();
      state.r3SelectedOption = idx;
      const scenario = ROUND3_SCENARIOS[state.r3Idx];
      const chosen = scenario.options[idx];
      state.r3TempScore += chosen.score;
      state.r3TempDetails.push({
        scenarioTitle: scenario.title,
        decisionMaker: state.r3SelectedDecisionMaker || '-',
        choice: `${chosen.tag} (${chosen.text})`,
        score: chosen.score
      });

      if (chosen.score === 100) playSuccess();
      else playError();
      render();
    }

    async function nextR3Step() {
      if (state.r3Idx + 1 < ROUND3_SCENARIOS.length) {
        state.r3Idx++;
        state.r3SelectedOption = null;
        startR3Timer();
        render();
        return;
      }

      const team = state.teams[state.activeTeamIdx];
      const finishedPlayer = state.r3SelectedDecisionMaker || state.currentPlayerName;
      const finishedTeamIdx = state.activeTeamIdx;

      const prevPlayerR3Score = (team.r3PlayerSubmissions[finishedPlayer] && team.r3PlayerSubmissions[finishedPlayer].score) || 0;
      team.r3PlayerSubmissions[finishedPlayer] = {
        score: state.r3TempScore,
        details: [...state.r3TempDetails]
      };

      team.score = team.score - prevPlayerR3Score + state.r3TempScore;
      team.r3Score = team.r3Score - prevPlayerR3Score + state.r3TempScore;
      team.r3Details = [
        ...team.r3Details.filter(d => d.decisionMaker !== finishedPlayer),
        ...state.r3TempDetails
      ];
      team.r3Completed = true;
      team.completedPlayers[finishedPlayer] = true;

      state.r3SelectedDecisionMaker = null;
      state.r3Idx = 0;
      state.r3SelectedOption = null;
      state.r3TempScore = 0;
      state.r3TempDetails = [];

      playFanfare();
      if (typeof confetti === 'function') {
        confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } });
      }

      await openDashboardScreen(finishedTeamIdx, finishedPlayer);

      const allTeamMembersCompleted = team.members.every(m => Boolean(team.completedPlayers[m]));
      if (allTeamMembersCompleted) {
        await saveTeamSessionToDatabase(team);
      }
    }

    function renderPrivateScoreBar(title, subtitle) {
      const activeTeam = state.teams[state.activeTeamIdx];
      return `
        <div class="glass-card rounded-2xl p-3 sm:p-4 flex flex-wrap items-center justify-between gap-2">
          <div>
            <h2 class="font-extrabold text-xs sm:text-base text-slate-900">${title}</h2>
            <p class="text-slate-500 hidden sm:block" style="font-size: 11px;">${subtitle}</p>
          </div>
          <div class="flex items-center gap-2">
            <div class="px-2.5 py-1.5 rounded-xl text-xs font-bold bg-sky-600 text-white shadow-sm flex items-center gap-1.5">
              <i data-lucide="user-check" class="w-3.5 h-3.5"></i>
              <span>${activeTeam.name}: <strong class="font-black">${activeTeam.score} PTS</strong></span>
            </div>
          </div>
        </div>
      `;
    }

    // ==========================================
    // MENU DASHBOARD (PILIH TIM BERLOMBA & NILAI PRIBADI)
    // ==========================================
    function selectPrivateMember(name) {
      state.selectedPrivateMemberName = name;
      render();
    }

    function renderSummary() {
      const competingIdx = state.teams[state.dashboardCompetingTeamIdx] ? state.dashboardCompetingTeamIdx : 0;
      const competingTeam = state.teams[competingIdx];

      const completedPlayersCount = competingTeam.members.filter(m => Boolean(competingTeam.completedPlayers[m])).length;
      const nextUnfinishedMember = competingTeam.members.find(m => !competingTeam.completedPlayers[m]) || null;

      const teamIdx = state.mode === 'single' ? 0 : (state.selectedPrivateTeamIdx !== null ? state.selectedPrivateTeamIdx : competingIdx);
      const chosenTeam = state.teams[teamIdx] || competingTeam;
      const chosenMember = state.selectedPrivateMemberName;

      let personalMatchCount = 0;
      const personalHistory = [];
      if (chosenTeam && chosenMember && chosenTeam.r1Details) {
        chosenTeam.r1Details.forEach((d, idx) => {
          const found = d.answers.find(a => a.member === chosenMember);
          if (found) {
            const isMatched = found.answer === d.topAnswer;
            if (isMatched) personalMatchCount++;
            personalHistory.push({
              qNum: idx + 1,
              myAnswer: found.answer,
              isMatched
            });
          }
        });
      }

      const personalR2Data = chosenTeam && chosenMember && chosenTeam.r2PlayerSubmissions[chosenMember]
        ? chosenTeam.r2PlayerSubmissions[chosenMember]
        : { words: chosenTeam ? chosenTeam.r2Words : 0, points: chosenTeam ? chosenTeam.r2Points : 0 };

      const personalR3Data = chosenTeam && chosenMember && chosenTeam.r3PlayerSubmissions[chosenMember]
        ? chosenTeam.r3PlayerSubmissions[chosenMember]
        : { score: chosenTeam ? chosenTeam.r3Score : 0 };

      const personalHarmony = personalHistory.length
        ? Math.round((personalMatchCount / personalHistory.length) * 100)
        : (chosenTeam ? chosenTeam.r1Harmony : 0);
      const personalR1Points = chosenTeam ? chosenTeam.r1Points : 0;
      const personalTotalScore = chosenTeam ? chosenTeam.score : 0;
      const pred = getPredicate(personalTotalScore);

      let syncBanner = '';
      if (state.saveStatus === 'saving') {
        syncBanner = `<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-sky-100 text-sky-800 text-xs font-bold mb-3"><i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i> Menyimpan hasil tim ke Supabase...</div>`;
      } else if (state.saveStatus === 'saved') {
        syncBanner = `<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-100 text-emerald-800 text-xs font-bold mb-3"><i data-lucide="cloud-check" class="w-3.5 h-3.5"></i> Tersimpan ke Database Supabase</div>`;
      } else {
        syncBanner = `<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-slate-900 text-teal-300 text-xs font-bold mb-3"><i data-lucide="layout-dashboard" class="w-3.5 h-3.5"></i> Menu Dashboard Peserta &amp; Tim</div>`;
      }

      return `
        <div class="space-y-4 sm:space-y-5">
          <!-- PANEL 1: PILIH TIM YANG AKAN BERLOMBA -->
          <div class="glass-card rounded-3xl p-4 sm:p-6">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
              <div>
                <div class="flex items-center gap-2">
                  <span class="w-6 h-6 rounded-lg bg-sky-600 text-white flex items-center justify-center">
                    <i data-lucide="swords" class="w-3.5 h-3.5"></i>
                  </span>
                  <h3 class="text-sm sm:text-base font-extrabold text-slate-900">Pilih Tim yang Akan Berlomba</h3>
                </div>
                <p class="text-slate-500 mt-0.5" style="font-size: 11px;">Pilih tim di bawah ini, lalu mulai rangkaian <strong>Ronde 1 → Ronde 2 → Ronde 3</strong>.</p>
              </div>
              <div class="flex items-center gap-1.5">
                <button onclick="manualForceSync()" class="px-2.5 py-1.5 rounded-xl border border-emerald-200 bg-emerald-50 hover:bg-emerald-100 text-xs font-bold text-emerald-800 inline-flex items-center gap-1">
                  <i data-lucide="refresh-cw" class="w-3 h-3"></i>
                  <span>Sync</span>
                </button>
                <button onclick="goHome()" class="px-2.5 py-1.5 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-xs font-bold text-slate-700">
                  ← Awal
                </button>
              </div>
            </div>

            <!-- Kartu Pilihan Tim -->
            <div class="grid grid-cols-1 ${state.teams.length > 1 ? 'sm:grid-cols-2' : ''} gap-3 mb-4">
              ${state.teams.map((t, idx) => {
                const isSelected = idx === competingIdx;
                const doneCount = t.members.filter(m => Boolean(t.completedPlayers[m])).length;
                const allDone = doneCount === t.members.length;
                return `
                  <button onclick="selectDashboardCompetingTeam(${idx})"
                    class="p-3.5 sm:p-4 rounded-2xl border-2 text-left transition relative ${
                      isSelected
                        ? 'border-sky-600 bg-sky-50 shadow-md'
                        : 'border-slate-200 bg-white hover:border-sky-400'
                    }">
                    <div class="flex items-start justify-between gap-2 mb-2">
                      <div class="flex items-center gap-2 min-w-0">
                        <span class="px-2 py-0.5 rounded-md font-extrabold text-white flex-shrink-0 ${isSelected ? 'bg-sky-600' : 'bg-slate-700'}" style="font-size: 10px;">
                          TIM ${idx + 1}
                        </span>
                        <span class="font-extrabold text-sm text-slate-900 truncate">${t.name}</span>
                      </div>
                      <span class="px-2 py-0.5 rounded-full font-bold flex-shrink-0 ${
                        allDone
                          ? 'bg-emerald-100 text-emerald-800'
                          : isSelected
                            ? 'bg-sky-600 text-white'
                            : 'bg-slate-100 text-slate-600'
                      }" style="font-size: 10px;">
                        ${allDone ? '✓ Tuntas' : isSelected ? 'Terpilih' : 'Pilih'}
                      </span>
                    </div>

                    <p class="text-slate-500 truncate mb-2.5" style="font-size: 11px;">
                      Anggota: ${t.members.join(', ')}
                    </p>

                    <div class="flex items-center justify-between text-xs pt-2 border-t border-slate-100">
                      <span class="font-bold text-slate-600">Tuntas 3 Ronde:</span>
                      <span class="font-extrabold ${allDone ? 'text-emerald-700' : 'text-sky-700'}">${doneCount} / ${t.members.length} Orang</span>
                    </div>
                  </button>
                `;
              }).join('')}
            </div>

            <!-- Tombol Utama Mulai Berlomba untuk Tim Terpilih -->
            <div class="p-3.5 sm:p-4 rounded-2xl bg-slate-900 text-white">
              <div class="flex flex-wrap items-center justify-between gap-3">
                <div>
                  <span class="uppercase tracking-wider text-teal-300 font-bold block" style="font-size: 10px;">Tim Terpilih Berlomba</span>
                  <h4 class="text-sm sm:text-lg font-extrabold text-white">${competingTeam.name}</h4>
                  <p class="text-slate-300" style="font-size: 11px;">
                    ${completedPlayersCount}/${competingTeam.members.length} anggota tuntas • R1 → R2 → R3
                  </p>
                </div>
                <button onclick="resumeRoundFromDashboard('round1', ${competingIdx}, ${nextUnfinishedMember ? `'${nextUnfinishedMember.replace(/'/g, "\\'")}'` : 'null'})"
                  class="w-full sm:w-auto px-4 sm:px-5 py-3 sm:py-3.5 rounded-xl start-btn-gradient text-white font-extrabold text-xs sm:text-sm inline-flex items-center justify-center gap-2 shadow-lg">
                  <i data-lucide="play" class="w-4 h-4 flex-shrink-0"></i>
                  <span class="truncate">
                    ${nextUnfinishedMember
                      ? `Mulai Giliran ${nextUnfinishedMember}`
                      : `Pilih Pemain di ${competingTeam.name}`}
                  </span>
                </button>
              </div>
            </div>
          </div>

          <!-- PANEL 2: KARTU HASIL & NILAI PRIBADI PEMAIN -->
          <div class="glass-card rounded-3xl p-4 sm:p-8 text-center">
            ${syncBanner}
            <h2 class="text-lg sm:text-3xl font-extrabold text-slate-900 mb-2">Dashboard Nilai &amp; Hasil Pribadi</h2>
            <p class="text-xs sm:text-sm text-slate-600 max-w-xl mx-auto mb-5">
              Pilih <strong>nama Anda sendiri</strong> pada tim <strong>${chosenTeam.name}</strong> di bawah ini untuk melihat rincian hasil setelah menyelesaikan Ronde 1, 2, dan 3.
            </p>

            ${chosenTeam ? `
              <div class="mb-6">
                <p class="font-bold uppercase tracking-wider text-slate-400 mb-2" style="font-size: 11px;">
                  Pilih Nama Anda (${chosenTeam.name}):
                </p>
                <div class="flex flex-wrap justify-center gap-2">
                  ${chosenTeam.members.map(m => {
                    const isAllDone = Boolean(chosenTeam.completedPlayers[m]);
                    return `
                      <button onclick="selectPrivateMember('${m.replace(/'/g, "\\'")}')"
                        class="px-3.5 py-2 rounded-xl border-2 text-xs sm:text-sm font-bold transition inline-flex items-center gap-1.5 ${chosenMember === m ? 'border-sky-600 bg-sky-600 text-white shadow-md' : 'border-slate-200 bg-white text-slate-700 hover:border-sky-400'}">
                        <span>${m}</span>
                        ${isAllDone ? `<span class="w-2 h-2 rounded-full ${chosenMember === m ? 'bg-teal-300' : 'bg-emerald-500'}"></span>` : ''}
                      </button>
                    `;
                  }).join('')}
                </div>
              </div>
            ` : ''}

            ${chosenTeam && chosenMember ? `
              <div class="max-w-xl mx-auto p-4 sm:p-6 rounded-2xl bg-white border-2 border-sky-200 shadow-md text-left mb-6">
                <div class="flex flex-wrap items-center justify-between gap-2 pb-4 border-b border-slate-100">
                  <div>
                    <span class="font-bold uppercase tracking-wider text-sky-600" style="font-size: 11px;">Kartu Dashboard Pribadi</span>
                    <h3 class="text-base sm:text-xl font-extrabold text-slate-900">${chosenMember}</h3>
                    <p class="text-xs text-slate-500">${chosenTeam.name}</p>
                  </div>
                  <div class="text-right">
                    <div class="text-2xl sm:text-3xl font-black text-sky-600">${personalTotalScore}</div>
                    <span class="font-bold text-slate-400" style="font-size: 10px;">TOTAL SKOR TIM</span>
                  </div>
                </div>

                <div class="my-3.5">
                  <span class="px-3 py-1 rounded-full border text-xs font-bold ${pred.badge}">
                    ${pred.emoji} ${pred.title}
                  </span>
                </div>

                <div class="grid grid-cols-3 gap-1.5 sm:gap-2 text-center mb-4">
                  <div class="p-2 sm:p-3 rounded-xl bg-slate-50 border border-slate-100">
                    <p class="text-slate-500 font-semibold" style="font-size: 10px;">R1: Frekuensi</p>
                    <p class="text-sm sm:text-base font-black text-slate-900 mt-0.5">${personalHarmony}%</p>
                    <p class="text-sky-600 font-bold" style="font-size: 10px;">+${personalR1Points} pts</p>
                  </div>
                  <div class="p-2 sm:p-3 rounded-xl bg-slate-50 border border-slate-100">
                    <p class="text-slate-500 font-semibold" style="font-size: 10px;">R2: Estafet Kata</p>
                    <p class="text-sm sm:text-base font-black text-slate-900 mt-0.5">${personalR2Data.words} kata</p>
                    <p class="text-teal-600 font-bold" style="font-size: 10px;">+${personalR2Data.points} pts</p>
                  </div>
                  <div class="p-2 sm:p-3 rounded-xl bg-slate-50 border border-slate-100">
                    <p class="text-slate-500 font-semibold" style="font-size: 10px;">R3: Misi Darurat</p>
                    <p class="text-sm sm:text-base font-black text-slate-900 mt-0.5">+${personalR3Data.score}</p>
                    <p class="text-indigo-600 font-bold" style="font-size: 10px;">3 Studi Kasus</p>
                  </div>
                </div>

                ${personalHistory.length > 0 ? `
                  <div class="space-y-2 pt-3 border-t border-slate-100">
                    <p class="font-bold uppercase tracking-wider text-slate-500" style="font-size: 11px;">Catatan Jawaban ${chosenMember} (Ronde 1):</p>
                    ${personalHistory.map(item => `
                      <div class="p-2.5 rounded-xl bg-slate-50 text-xs flex items-center justify-between gap-2">
                        <span class="text-slate-600 truncate">Q${item.qNum}: ${item.myAnswer}</span>
                        <span class="flex-shrink-0 px-2 py-0.5 rounded font-bold ${item.isMatched ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-600'}" style="font-size: 10px;">
                          ${item.isMatched ? 'Satu Frekuensi' : 'Pilihan Unik'}
                        </span>
                      </div>
                    `).join('')}
                  </div>
                ` : `
                  <div class="p-3 rounded-xl bg-amber-50 border border-amber-200 text-amber-900 text-xs flex flex-wrap items-center justify-between gap-2">
                    <span><strong>${chosenMember}</strong> belum menyelesaikan Ronde 1 → 2 → 3.</span>
                    <button onclick="resumeRoundFromDashboard('round1', ${teamIdx}, '${chosenMember.replace(/'/g, "\\'")}')" class="px-3 py-1.5 rounded-lg bg-amber-500 text-white font-bold">
                      Mulai Sekarang →
                    </button>
                  </div>
                `}
              </div>
            ` : `
              <div class="max-w-md mx-auto p-5 rounded-2xl border border-dashed border-slate-300 text-slate-500 text-xs mb-5">
                Silakan klik nama Anda sendiri di atas untuk menampilkan kartu nilai pribadi Anda.
              </div>
            `}

            <div class="flex flex-wrap justify-center gap-3">
              <button onclick="openAdminModal('recap')" class="w-full sm:w-auto px-6 py-3.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm inline-flex items-center justify-center gap-2">
                <i data-lucide="bar-chart-3" class="w-4 h-4 text-teal-400"></i>
                <span>Lihat Rekapitulasi Admin</span>
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // ==========================================
    // 5. ADMIN DASHBOARD (KELOLA TIM/ANGGOTA & REKAP SUPABASE)
    // ==========================================
    async function openAdminModal(initialTab = 'recap') {
      state.adminTab = initialTab;
      document.getElementById('adminModal').classList.remove('hidden');
      if (state.adminLoggedIn) {
        if (initialTab === 'recap') {
          await refreshAdminData();
        } else {
          await syncTeamsFromSupabase(state.mode, false);
          renderAdminBody();
        }
      } else {
        renderAdminBody();
      }
    }

    function closeAdminModal() {
      document.getElementById('adminModal').classList.add('hidden');
    }

    async function switchAdminTab(tabName) {
      state.adminTab = tabName;
      if (tabName === 'recap') {
        await refreshAdminData();
      } else {
        await syncTeamsFromSupabase(state.mode, false);
        renderAdminBody();
      }
    }

    async function refreshAdminData() {
      state.adminLoading = true;
      renderAdminBody();
      state.adminHistoryCache = await fetchHistoryFromSupabase();
      state.adminLoading = false;
      renderAdminBody();
    }

    function toggleSessionDetail(sessionId) {
      state.expandedSessionId = state.expandedSessionId === sessionId ? null : sessionId;
      renderAdminBody();
    }

    function handleAdminCreateTeam() {
      const input = document.getElementById('adminNewTeamInput');
      const nameVal = (input ? input.value : state.adminNewTeamName || '').trim();
      if (state.teams.length >= 4) return;
      addTeam(nameVal);
      state.adminNewTeamName = '';
      renderAdminBody();
    }

    function renderAdminBody() {
      const body = document.getElementById('adminModalBody');
      if (!state.adminLoggedIn) {
        body.innerHTML = `
          <div class="max-w-sm mx-auto py-8 text-center">
            <div class="w-14 h-14 rounded-2xl bg-slate-900 text-teal-400 flex items-center justify-center mx-auto mb-4">
              <i data-lucide="lock" class="w-7 h-7"></i>
            </div>
            <h3 class="text-lg font-extrabold text-slate-900 mb-1">Verifikasi Akses Admin</h3>
            <p class="text-xs text-slate-500 mb-5">Masukkan PIN Admin Yankes untuk mengelola tim/anggota &amp; melihat rekapitulasi Supabase (PIN default: <strong>1234</strong>).</p>
            <input id="adminPinInput" type="password" inputmode="numeric" maxlength="8" placeholder="••••"
              onkeydown="if(event.key==='Enter') verifyAdminPin()"
              class="w-full text-center text-xl font-black border-2 border-slate-200 rounded-xl py-3 mb-3 focus:outline-none focus:border-sky-600" style="letter-spacing: 0.5em;" />
            <p id="adminPinError" class="text-xs text-rose-600 font-semibold mb-3 hidden">PIN salah. Silakan coba lagi.</p>
            <button onclick="verifyAdminPin()" class="w-full py-3.5 rounded-xl bg-sky-600 hover:bg-sky-700 text-white font-bold text-sm">
              Masuk Panel Admin
            </button>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      const adminNavTabs = `
        <div class="flex flex-wrap items-center justify-between gap-2 pb-4 mb-5 border-b border-slate-200">
          <div class="flex items-center gap-2">
            <button onclick="switchAdminTab('recap')"
              class="px-3.5 py-2 rounded-xl text-xs font-extrabold inline-flex items-center gap-1.5 transition ${
                state.adminTab === 'recap'
                  ? 'bg-slate-900 text-white shadow-sm'
                  : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
              }">
              <i data-lucide="bar-chart-3" class="w-4 h-4 ${state.adminTab === 'recap' ? 'text-teal-400' : ''}"></i>
              <span>Rekapitulasi</span>
            </button>

            <button onclick="switchAdminTab('teams')"
              class="px-3.5 py-2 rounded-xl text-xs font-extrabold inline-flex items-center gap-1.5 transition ${
                state.adminTab === 'teams'
                  ? 'bg-sky-600 text-white shadow-sm'
                  : 'bg-sky-50 text-sky-800 hover:bg-sky-100 border border-sky-200'
              }">
              <i data-lucide="users" class="w-4 h-4"></i>
              <span>Kelola Tim (${state.teams.length})</span>
            </button>
          </div>

          <button onclick="adminLogout()" class="text-xs font-bold text-slate-500 hover:text-rose-600 px-2 py-1">
            Keluar
          </button>
        </div>
      `;

      // TAB 2: KELOLA TIM & ANGGOTA
      if (state.adminTab === 'teams') {
        const teamAccents = [
          { border: 'border-sky-200', badgeBg: 'bg-sky-600', chipBg: 'bg-sky-50 border-sky-200 text-sky-900', avatarBg: 'bg-sky-600 text-white' },
          { border: 'border-teal-200', badgeBg: 'bg-teal-600', chipBg: 'bg-teal-50 border-teal-200 text-teal-950', avatarBg: 'bg-teal-600 text-white' },
          { border: 'border-indigo-200', badgeBg: 'bg-indigo-600', chipBg: 'bg-indigo-50 border-indigo-200 text-indigo-950', avatarBg: 'bg-indigo-600 text-white' },
          { border: 'border-amber-200', badgeBg: 'bg-amber-500', chipBg: 'bg-amber-50 border-amber-200 text-amber-900', avatarBg: 'bg-amber-500 text-white' }
        ];

        body.innerHTML = `
          <div>
            ${adminNavTabs}

            ${state.adminTeamSaveMsg ? `
              <div class="p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-900 text-xs font-bold mb-4 flex items-center gap-2">
                <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-600"></i>
                <span>${state.adminTeamSaveMsg}</span>
              </div>
            ` : ''}

            <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 mb-5">
              <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                <div>
                  <h4 class="font-extrabold text-sm text-slate-900">Tambah Tim Baru (Maks. 4 Tim)</h4>
                  <p class="text-slate-500" style="font-size: 11px;">Perubahan tim &amp; nama anggota otomatis tersinkron ke Supabase dan seluruh layar HP peserta.</p>
                </div>
                <span class="px-2.5 py-1 rounded-lg bg-white border border-slate-200 text-xs font-bold text-slate-700">
                  Total: ${state.teams.length}/4 Tim
                </span>
              </div>

              ${state.teams.length < 4 ? `
                <div class="flex flex-col sm:flex-row gap-2">
                  <input type="text" id="adminNewTeamInput"
                    value="${state.adminNewTeamName}"
                    oninput="state.adminNewTeamName = this.value"
                    onkeydown="if(event.key==='Enter'){ event.preventDefault(); handleAdminCreateTeam(); }"
                    placeholder="Contoh: Tim 3 - Pelayanan Rujukan..."
                    class="text-xs sm:text-sm font-semibold text-slate-800 bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 w-full focus:outline-none focus:border-sky-600" />
                  <button onclick="handleAdminCreateTeam()" class="px-5 py-2.5 rounded-xl bg-sky-600 hover:bg-sky-700 text-white font-extrabold text-xs sm:text-sm inline-flex items-center justify-center gap-1.5 flex-shrink-0 transition">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i>
                    <span>Tambah Tim Baru</span>
                  </button>
                </div>
              ` : `
                <p class="text-xs font-semibold text-amber-700">Jumlah maksimal 4 tim sudah tercapai.</p>
              `}
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${state.teams.map((t, tIdx) => {
                const accent = teamAccents[tIdx % teamAccents.length];
                return `
                  <div class="p-4 rounded-2xl bg-white border-2 ${accent.border} shadow-sm flex flex-col justify-between">
                    <div>
                      <div class="flex items-center justify-between gap-2 mb-3">
                        <div class="flex items-center gap-2 w-full">
                          <span class="px-2.5 py-1 rounded-lg ${accent.badgeBg} text-white font-extrabold flex-shrink-0" style="font-size: 10px;">
                            TIM ${tIdx + 1}
                          </span>
                          <input type="text" value="${t.name}" onchange="updateTeamName(${tIdx}, this.value)"
                            class="font-extrabold text-slate-900 bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 text-sm w-full focus:outline-none focus:border-sky-500"
                            placeholder="Nama Tim" />
                        </div>
                        ${state.teams.length > 1 ? `
                          <button onclick="removeTeam(${tIdx})" title="Hapus Tim" class="p-2 text-rose-500 hover:bg-rose-50 rounded-xl flex-shrink-0 transition">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                          </button>
                        ` : ''}
                      </div>

                      <p class="font-bold text-slate-500 mb-2" style="font-size: 11px;">
                        Daftar Orang dalam ${t.name} (${t.members.length} orang):
                      </p>

                      <div class="flex flex-wrap gap-1.5 mb-3.5">
                        ${t.members.map((m, mIdx) => `
                          <span class="inline-flex items-center gap-1.5 pl-1.5 pr-2.5 py-1 rounded-xl border text-xs font-bold ${accent.chipBg}">
                            <span class="w-5 h-5 rounded-lg ${accent.avatarBg} font-extrabold flex items-center justify-center flex-shrink-0" style="font-size: 10px;">
                              ${m.charAt(0).toUpperCase()}
                            </span>
                            <span>${m}</span>
                            ${t.members.length > 1 ? `
                              <button onclick="removeMemberFromTeam(${tIdx}, ${mIdx}, true)" title="Hapus ${m}" class="ml-0.5 opacity-60 hover:opacity-100 text-rose-600">
                                <i data-lucide="x" class="w-3 h-3"></i>
                              </button>
                            ` : ''}
                          </span>
                        `).join('')}
                      </div>
                    </div>

                    <div class="flex gap-1.5 pt-2.5 border-t border-slate-100">
                      <input type="text" id="adminNewMemberInput_${tIdx}"
                        value="${state.adminMemberDrafts[tIdx] || ''}"
                        oninput="state.adminMemberDrafts[${tIdx}] = this.value"
                        onkeydown="if(event.key==='Enter'){ event.preventDefault(); addMemberToTeam(${tIdx}, true); }"
                        placeholder="Ketik nama anggota baru..."
                        class="text-xs font-medium text-slate-700 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 w-full focus:outline-none focus:border-sky-500" />
                      <button onclick="addMemberToTeam(${tIdx}, true)" class="px-3.5 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-extrabold flex-shrink-0 transition">
                        + Tambah Orang
                      </button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>

            <div class="mt-5 pt-4 border-t border-slate-100 flex flex-wrap items-center justify-between gap-2">
              <span class="text-slate-400" style="font-size: 11px;">Tabel Konfigurasi: public.yankes_game_config</span>
              <button onclick="persistTeamsConfig(true)" class="w-full sm:w-auto px-5 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs inline-flex items-center justify-center gap-1.5 shadow-sm">
                <i data-lucide="cloud-upload" class="w-4 h-4"></i>
                <span>Simpan Semua ke Cloud Supabase</span>
              </button>
            </div>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      // TAB 1: REKAPITULASI SESI & NILAI
      if (state.adminLoading) {
        body.innerHTML = `
          <div>
            ${adminNavTabs}
            <div class="py-16 text-center text-slate-500">
              <i data-lucide="loader-2" class="w-8 h-8 animate-spin text-sky-600 mx-auto mb-3"></i>
              <p class="text-sm font-bold text-slate-700">Memuat data rekapitulasi dari Supabase...</p>
            </div>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      const history = state.adminHistoryCache;
      const totalSessions = history.length;
      const allTeams = history.flatMap(h => h.teams);
      const totalTeamsCount = allTeams.length;
      const avgAllHarmony = totalSessions
        ? Math.round(history.reduce((acc, h) => acc + h.avgHarmony, 0) / totalSessions)
        : 0;
      const avgTotalScore = totalTeamsCount
        ? Math.round(allTeams.reduce((acc, t) => acc + t.score, 0) / totalTeamsCount)
        : 0;

      body.innerHTML = `
        <div class="space-y-6">
          ${adminNavTabs}

          <div class="flex flex-wrap items-center justify-between gap-2 px-4 py-2.5 rounded-xl ${dbConnected ? 'bg-emerald-50 border border-emerald-200 text-emerald-900' : 'bg-amber-50 border border-amber-200 text-amber-900'} text-xs">
            <div class="flex items-center gap-2 font-bold">
              <i data-lucide="${dbConnected ? 'cloud-check' : 'hard-drive'}" class="w-4 h-4"></i>
              <span>${dbConnected ? 'Terhubung ke Supabase Cloud Database' : 'Mode Lokal (Ganti SUPABASE_ANON_KEY dengan key asli untuk sinkron HP)'}</span>
            </div>
            <button onclick="refreshAdminData()" class="px-2.5 py-1 rounded-lg bg-white border border-slate-200 hover:bg-slate-50 font-bold text-slate-700 inline-flex items-center gap-1">
              <i data-lucide="refresh-cw" class="w-3 h-3"></i> Segarkan
            </button>
          </div>

          <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
            <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200">
              <p class="font-semibold text-slate-500" style="font-size: 11px;">Total Sesi Bermain</p>
              <p class="text-2xl font-black text-slate-900 mt-1">${totalSessions} <span class="text-xs font-medium text-slate-400">Sesi</span></p>
            </div>
            <div class="p-4 rounded-2xl bg-indigo-50 border border-indigo-200">
              <p class="font-semibold text-indigo-700" style="font-size: 11px;">Total Tim Terevaluasi</p>
              <p class="text-2xl font-black text-indigo-950 mt-1">${totalTeamsCount} <span class="text-xs font-medium text-indigo-400">Tim</span></p>
            </div>
            <div class="p-4 rounded-2xl bg-sky-50 border border-sky-200">
              <p class="font-semibold text-sky-700" style="font-size: 11px;">Rata-Rata Satu Frekuensi</p>
              <p class="text-2xl font-black text-sky-900 mt-1">${avgAllHarmony}%</p>
            </div>
            <div class="p-4 rounded-2xl bg-teal-50 border border-teal-200 flex flex-col justify-between">
              <div>
                <p class="font-semibold text-teal-700" style="font-size: 11px;">Rata-Rata Skor Total</p>
                <p class="text-xl font-black text-teal-950">${avgTotalScore} <span class="text-xs font-normal">PTS</span></p>
              </div>
              <button onclick="exportHistoryCSV()" ${totalSessions === 0 ? 'disabled' : ''} class="mt-2 w-full py-1.5 rounded-lg bg-teal-600 hover:bg-teal-700 text-white font-bold flex items-center justify-center gap-1" style="font-size: 11px; ${totalSessions === 0 ? 'opacity:0.4;' : ''}">
                <i data-lucide="download" class="w-3.5 h-3.5"></i> Unduh CSV Lengkap
              </button>
            </div>
          </div>

          <div>
            <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
              <div>
                <h4 class="font-bold text-sm text-slate-800">Rekapitulasi Seluruh Tim &amp; Peran Pemain</h4>
                <p class="text-slate-500" style="font-size: 11px;">Klik tombol <strong>"Lihat Rincian Jawaban"</strong> untuk melihat jawaban detail per pertanyaan dan per anggota.</p>
              </div>
              ${totalSessions > 0 ? `
                <button onclick="clearHistory()" class="text-xs font-semibold text-rose-600 hover:underline">Hapus Semua Data</button>
              ` : ''}
            </div>

            ${totalSessions === 0 ? `
              <div class="p-10 text-center rounded-2xl border border-dashed border-slate-300 text-slate-500 text-sm">
                Belum ada riwayat permainan yang tersimpan. Selesaikan 1 sesi permainan maka seluruh hasilnya otomatis tercatat di sini.
              </div>
            ` : `
              <div class="space-y-4">
                ${history.map(h => {
                  const isExpanded = state.expandedSessionId === h.id;
                  return `
                    <div class="border border-slate-200 rounded-2xl overflow-hidden bg-white shadow-sm">
                      <div class="px-4 py-3 bg-slate-50 border-b border-slate-200 flex flex-wrap items-center justify-between gap-2">
                        <div class="flex items-center gap-2.5">
                          <span class="px-2.5 py-1 rounded-lg bg-slate-900 text-white font-bold text-xs">${h.id}</span>
                          <span class="text-xs font-semibold text-slate-600">${h.timestamp}</span>
                          <span class="px-2 py-0.5 rounded-md bg-sky-100 text-sky-800 font-bold" style="font-size: 11px;">${h.mode}</span>
                        </div>
                        <button onclick="toggleSessionDetail('${h.id}')" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg bg-white border border-slate-300 hover:bg-slate-100 text-xs font-bold text-slate-700 transition">
                          <i data-lucide="${isExpanded ? 'chevron-up' : 'eye'}" class="w-3.5 h-3.5 text-sky-600"></i>
                          <span>${isExpanded ? 'Tutup Rincian' : 'Lihat Rincian Jawaban'}</span>
                        </button>
                      </div>

                      <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-xs">
                          <thead>
                            <tr class="bg-white text-slate-500 font-bold border-b border-slate-100 uppercase" style="font-size: 11px;">
                              <th class="p-3">Tim &amp; Anggota</th>
                              <th class="p-3 text-center">R1: Frekuensi (5 Soal)</th>
                              <th class="p-3 text-center">R2: Estafet Kata</th>
                              <th class="p-3 text-center">R3: Misi (3 Kasus)</th>
                              <th class="p-3 text-center">Total Skor</th>
                              <th class="p-3">Predikat Kekompakan</th>
                            </tr>
                          </thead>
                          <tbody class="divide-y divide-slate-100">
                            ${h.teams.map(t => `
                              <tr class="hover:bg-slate-50">
                                <td class="p-3">
                                  <span class="font-extrabold text-slate-900 block">${t.name}</span>
                                  <span class="text-slate-500" style="font-size: 11px;">${t.members.join(', ')}</span>
                                </td>
                                <td class="p-3 text-center">
                                  <span class="font-bold text-sky-700 block">${t.r1Harmony}%</span>
                                  <span class="text-slate-400" style="font-size: 10px;">(+${t.r1Points ?? t.r1Harmony} pts)</span>
                                </td>
                                <td class="p-3 text-center">
                                  <span class="font-bold text-teal-700 block">${t.r2Words} kata</span>
                                  <span class="text-slate-500 block" style="font-size: 10px;">Pemandu: ${t.r2Speaker || '-'}</span>
                                </td>
                                <td class="p-3 text-center">
                                  <span class="font-bold text-indigo-700 block">+${t.r3Score} pts</span>
                                </td>
                                <td class="p-3 text-center">
                                  <span class="px-2.5 py-1 rounded-lg bg-slate-900 text-white font-black text-xs">${t.score}</span>
                                </td>
                                <td class="p-3">
                                  <span class="px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 font-bold inline-block" style="font-size: 11px;">
                                    ${t.predicate}
                                  </span>
                                </td>
                              </tr>
                            `).join('')}
                          </tbody>
                        </table>
                      </div>

                      ${isExpanded ? `
                        <div class="p-4 bg-sky-50 border-t border-sky-100 space-y-4">
                          <h5 class="font-extrabold text-xs uppercase tracking-wider text-sky-900">Detail Jawaban &amp; Keputusan Per Tim</h5>
                          ${h.teams.map(t => `
                            <div class="p-3.5 rounded-xl bg-white border border-sky-200 space-y-3">
                              <div class="font-bold text-xs text-slate-900 border-b border-slate-100 pb-1.5">
                                ${t.name}
                              </div>
                              ${t.r1Details && t.r1Details.length > 0 ? `
                                <div class="space-y-2">
                                  <p class="font-bold text-sky-800" style="font-size: 11px;">Ronde 1 — Jawaban Per Pertanyaan:</p>
                                  ${t.r1Details.map((d, qIdx) => `
                                    <div class="bg-slate-50 p-2.5 rounded-lg" style="font-size: 11px;">
                                      <p class="font-semibold text-slate-700 mb-1">Q${qIdx + 1}: "${d.question}" — <span class="text-emerald-700 font-bold">Kompak ${d.harmonyPct}% (${d.topAnswer})</span></p>
                                      <div class="flex flex-wrap gap-1.5">
                                        ${d.answers.map(a => `
                                          <span class="px-2 py-0.5 rounded bg-white border border-slate-200 text-slate-600">
                                            <strong>${a.member}:</strong> ${a.answer}
                                          </span>
                                        `).join('')}
                                      </div>
                                    </div>
                                  `).join('')}
                                </div>
                              ` : ''}
                              ${t.r3Details && t.r3Details.length > 0 ? `
                                <div class="space-y-1.5 pt-2 border-t border-slate-100">
                                  <p class="font-bold text-indigo-800" style="font-size: 11px;">Ronde 3 — Keputusan Studi Kasus:</p>
                                  ${t.r3Details.map((c, cIdx) => `
                                    <div class="bg-indigo-50 p-2 rounded-lg flex flex-wrap justify-between gap-2" style="font-size: 11px;">
                                      <span><strong>Kasus ${cIdx + 1} (${c.decisionMaker}):</strong> ${c.choice}</span>
                                      <span class="font-bold text-indigo-700">+${c.score} pts</span>
                                    </div>
                                  `).join('')}
                                </div>
                              ` : ''}
                            </div>
                          `).join('')}
                        </div>
                      ` : ''}
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    async function verifyAdminPin() {
      const val = document.getElementById('adminPinInput').value;
      if (val === ADMIN_PIN) {
        state.adminLoggedIn = true;
        playSuccess();
        if (state.adminTab === 'recap') {
          await refreshAdminData();
        } else {
          await syncTeamsFromSupabase(state.mode, false);
          renderAdminBody();
        }
      } else {
        playError();
        document.getElementById('adminPinError').classList.remove('hidden');
      }
    }

    function adminLogout() {
      state.adminLoggedIn = false;
      renderAdminBody();
    }

    async function clearHistory() {
      if (!confirm('Hapus seluruh data riwayat kekompakan tim di Supabase & lokal?')) return;
      localStorage.removeItem(STORAGE_KEY);
      if (supabaseClient) {
        try {
          await supabaseClient
            .from('yankes_game_sessions')
            .delete()
            .neq('session_code', '');
        } catch (e) {}
      }
      state.adminHistoryCache = [];
      renderAdminBody();
    }

    function exportHistoryCSV() {
      const history = state.adminHistoryCache;
      if (!history.length) return;
      const rows = [[
        'ID Sesi',
        'Waktu',
        'Mode',
        'Nama Tim',
        'Anggota',
        'R1 Satu Frekuensi (%)',
        'R1 Poin',
        'R2 Pemandu Kata',
        'R2 Estafet Kata',
        'R2 Poin',
        'R3 Ringkasan Keputusan',
        'R3 Poin',
        'Total Skor',
        'Predikat Kekompakan'
      ]];
      history.forEach(h => {
        h.teams.forEach(t => {
          const r3Summary = (t.r3Details || [])
            .map((c, idx) => `K${idx + 1}[${c.decisionMaker}]: ${c.choice}`)
            .join(' | ') || '-';
          rows.push([
            h.id,
            `"${h.timestamp}"`,
            `"${h.mode}"`,
            `"${t.name}"`,
            `"${t.members.join('; ')}"`,
            t.r1Harmony,
            t.r1Points ?? t.r1Harmony,
            `"${t.r2Speaker || '-'}"`,
            t.r2Words,
            t.r2Points ?? (t.r2Words * 10),
            `"${r3Summary.replace(/"/g, '""')}"`,
            t.r3Score,
            t.score,
            `"${t.predicate}"`
          ]);
        });
      });
      const csvContent = "data:text/csv;charset=utf-8," + rows.map(e => e.join(",")).join("\n");
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `rekap_supabase_kekompakan_yankes_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    render();
    if (isSupabaseConfigured) {
      syncTeamsFromSupabase(state.mode, false);
      initSupabaseRealtime();
    } else {
      updateDbStatusBadge(false, 'Lokal', 'Mode Lokal');
    }
  </script>
</body>
</html>
